<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meridian - Command</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;

        background: #111;
        color: #d8d8d8;

        font-family: "Courier New", monospace;
        font-weight: 500;

        height: 100vh;

        overflow: hidden;
    }


    /* =========================
       HEADER
    ========================= */

    header {
        height: 60px;

        border-bottom: 1px solid #333;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 28px;

        background: #151515;

        position: relative;

        overflow: hidden;
    }


    .header-left {
        display: flex;

        align-items: center;

        gap: 25px;
    }


    .back-button {
        background: none;

        border: none;

        color: #666;

        font-family: "Courier New", monospace;

        font-size: 11px;

        font-weight: 500;

        letter-spacing: 1px;

        cursor: pointer;

        padding: 5px 0;
    }


    .back-button:hover {
        color: #aaa;
    }


    .logo {
        font-size: 18px;

        font-weight: 500;

        letter-spacing: 5px;

        color: #d8d8d8;
    }


    .system-name {
        font-size: 12px;

        font-weight: 500;

        color: #777;

        letter-spacing: 2px;
    }


    /* =========================
       HEADER AMBIENT PASS
    ========================= */

    header::after {
        content: "";

        position: absolute;

        top: 0;
        bottom: 0;

        width: 70px;

        left: -100px;

        background:
            linear-gradient(
                to right,
                transparent,
                rgba(143,165,138,0.025),
                transparent
            );

        pointer-events: none;

        animation:
            headerPass
            17s
            linear
            infinite;
    }


    @keyframes headerPass {

        0%,
        84% {
            left: -100px;

            opacity: 0;
        }

        85% {
            opacity: 1;
        }

        91% {
            left: calc(100% + 100px);

            opacity: 1;
        }

        92%,
        100% {
            left: calc(100% + 100px);

            opacity: 0;
        }

    }


    /* =========================
       TERMINAL AREA
    ========================= */

    .terminal {
        height: calc(100vh - 90px);

        padding: 34px 42px;

        overflow: hidden;

        background:
            repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 31px,
                rgba(255,255,255,0.012) 32px
            );
    }


    .terminal-window {
        max-width: 1100px;

        margin: 0 auto;

        height: 100%;

        display: flex;

        flex-direction: column;

        position: relative;

        border: 1px solid #2d332d;

        background: #121412;
    }


    /* structural corner marks */

    .terminal-window::before,
    .terminal-window::after {
        content: "";

        position: absolute;

        width: 14px;
        height: 14px;

        pointer-events: none;

        z-index: 5;
    }


    .terminal-window::before {
        top: -1px;
        left: -1px;

        border-top: 1px solid #71806f;

        border-left: 1px solid #71806f;
    }


    .terminal-window::after {
        right: -1px;
        bottom: -1px;

        border-right: 1px solid #71806f;

        border-bottom: 1px solid #71806f;
    }


    /* =========================
       TERMINAL HEADER
    ========================= */

    .terminal-title {
        min-height: 48px;

        padding: 0 18px;

        display: flex;

        align-items: center;

        border-bottom: 1px solid #303630;

        background: #151815;

        color: #8fa58a;

        font-size: 12px;

        font-weight: 600;

        letter-spacing: 2px;

        position: relative;

        flex-shrink: 0;
    }


    .terminal-title::before {
        content: "";

        width: 5px;
        height: 5px;

        margin-right: 12px;

        background: #839b7f;

        animation:
            statusActivity
            7s
            step-end
            infinite;
    }


    .terminal-title::after {
        content: "LOCAL // ACTIVE";

        position: absolute;

        right: 18px;

        color: #4f5c4f;

        font-size: 9px;

        font-weight: normal;

        letter-spacing: 1.5px;
    }


    @keyframes statusActivity {

        0%,
        71%,
        74%,
        100% {
            opacity: 1;
        }

        72% {
            opacity: 0.35;
        }

        73% {
            opacity: 0.75;
        }

    }


    /* =========================
       OUTPUT
    ========================= */

    .terminal-output {
        flex: 1;

        overflow-y: auto;

        padding: 24px 24px 30px;

        line-height: 1.65;

        font-size: 13px;

        scroll-behavior: smooth;
    }


    .output-line {
        margin-bottom: 6px;

        white-space: pre-wrap;

        animation:
            outputAppear
            0.12s
            ease-out;
    }


    @keyframes outputAppear {

        from {
            opacity: 0;

            transform:
                translateY(2px);
        }

        to {
            opacity: 1;

            transform:
                translateY(0);
        }

    }


    /* USER COMMAND */

    .command-line {
        color: #c4d6be;

        font-weight: 600;

        margin-top: 12px;
    }


    /* MERIDIAN RESPONSE */

    .system-line {
        color: #839783;

        font-weight: 500;
    }


    /* ERRORS / REJECTIONS */

    .error-line {
        color: #a99484;

        font-weight: 500;
    }


    /* =========================
       INPUT
    ========================= */

    .input-area {
        min-height: 56px;

        display: flex;

        align-items: center;

        margin: 0;

        padding: 0 20px;

        border-top: 1px solid #303630;

        background: #151815;

        position: relative;

        flex-shrink: 0;
    }


    .input-area::before {
        content: "";

        position: absolute;

        left: 0;
        top: 0;
        bottom: 0;

        width: 2px;

        background: #778b73;
    }


    .input-area:focus-within {
        background: #171a17;
    }


    .input-area:focus-within::before {
        background: #91a88c;
    }


    .prompt {
        color: #a9c29f;

        margin-right: 12px;

        font-size: 14px;

        font-weight: 600;

        user-select: none;
    }


    #command-input {
        flex: 1;

        height: 100%;

        background: transparent;

        border: none;

        outline: none;

        color: #c4d6be;

        font-family: "Courier New", monospace;

        font-size: 14px;

        font-weight: 600;

        caret-color: #a9c29f;
    }


    #command-input::placeholder {
        color: #465046;
    }


    /* =========================
       SCROLLBARS
    ========================= */

    .terminal-output::-webkit-scrollbar,
    .terminal::-webkit-scrollbar {
        width: 8px;
    }


    .terminal-output::-webkit-scrollbar-track,
    .terminal::-webkit-scrollbar-track {
        background: #111;
    }


    .terminal-output::-webkit-scrollbar-thumb,
    .terminal::-webkit-scrollbar-thumb {
        background: #3f4a40;

        border: 1px solid #111;

        border-radius: 0;

        min-height: 35px;
    }


    .terminal-output::-webkit-scrollbar-thumb:hover,
    .terminal::-webkit-scrollbar-thumb:hover {
        background: #657265;
    }


    .terminal-output,
    .terminal {
        scrollbar-width: thin;

        scrollbar-color:
            #3f4a40
            #111;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
        height: 30px;

        border-top: 1px solid #292d29;

        background: #151515;

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding: 0 20px;

        font-size: 10px;

        color: #555;

        letter-spacing: 1px;
    }


    footer div:last-child {
        color: #60705f;
    }


    /* =========================
       SUBTLE SCREEN TEXTURE
    ========================= */

    body::after {
        content: "";

        position: fixed;

        inset: 0;

        pointer-events: none;

        z-index: 999;

        opacity: 0.025;

        background:
            repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(255,255,255,0.03) 4px,
                transparent 5px
            );
    }


    /* =========================
       RESET GLITCH
    ========================= */

    body.reset-glitch {
        animation:
            reset-shake 0.08s infinite,
            reset-flicker 0.11s infinite;
    }


    body.reset-glitch::before,
    body.reset-glitch::after {
        content: "";

        position: fixed;

        left: 0;
        top: 0;

        width: 100vw;
        height: 100vh;

        pointer-events: none;

        z-index: 9999;
    }


    body.reset-glitch::before {
        background:
            repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 3px,
                rgba(255,255,255,0.035) 4px,
                transparent 5px
            );

        mix-blend-mode: screen;

        animation:
            reset-lines
            0.07s
            infinite;
    }


    body.reset-glitch::after {
        background:
            rgba(255,255,255,0.025);

        animation:
            reset-flash
            0.13s
            infinite;
    }


    @keyframes reset-shake {

        0% {
            transform:
                translate(0, 0);
        }

        20% {
            transform:
                translate(-6px, 2px);
        }

        40% {
            transform:
                translate(5px, -3px);
        }

        60% {
            transform:
                translate(-3px, 5px);
        }

        80% {
            transform:
                translate(7px, -2px);
        }

        100% {
            transform:
                translate(0, 0);
        }

    }


    @keyframes reset-flicker {

        0% {
            filter: none;
        }

        18% {
            filter:
                brightness(1.8);
        }

        21% {
            filter:
                brightness(0.3);
        }

        38% {
            filter: none;
        }

        57% {
            filter:
                brightness(2.5);
        }

        60% {
            filter:
                brightness(0.1);
        }

        79% {
            filter: none;
        }

        100% {
            filter:
                brightness(1.5);
        }

    }


    @keyframes reset-lines {

        0% {
            transform:
                translateY(0);
        }

        25% {
            transform:
                translateY(-18px);
        }

        50% {
            transform:
                translateY(11px);
        }

        75% {
            transform:
                translateY(-7px);
        }

        100% {
            transform:
                translateY(0);
        }

    }


    @keyframes reset-flash {

        0% {
            opacity: 0;
        }

        25% {
            opacity: 0.3;
        }

        26% {
            opacity: 0;
        }

        60% {
            opacity: 0.15;
        }

        61% {
            opacity: 0;
        }

        100% {
            opacity: 0;
        }

    }


    body.reset-blackout {
        background: #000;
    }


    body.reset-blackout > * {
        visibility: hidden;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {

        .terminal {
            padding:
                20px
                16px;
        }


        .terminal-title::after {
            display: none;
        }


        .terminal-output {
            padding:
                18px
                16px
                24px;
        }

    }


    @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {
            animation: none !important;

            transition: none !important;
        }

    }


/* =========================================================
                   REMOTE VFX
                   Triggered from the MERIDIAN control page.
                   Brighter red/white corruption closer to the reference look.
                ========================================================= */
        
                body.remote-glitch {
                    animation:
                        remoteGlitchShake 0.055s steps(2, end) infinite,
                        ambientBrightness 12s ease-in-out infinite;
        
                    filter:
                        contrast(1.16)
                        brightness(1.05);
                }
        
                body.remote-glitch::before,
                body.remote-glitch::after {
                    content: "";
                    position: fixed;
                    left: 0;
                    width: 100vw;
                    pointer-events: none;
                    z-index: 9998;
                    mix-blend-mode: screen;
                }
        
                body.remote-glitch::before {
                    top: 0;
                    height: 100vh;
        
                    background:
                        repeating-linear-gradient(
                            to bottom,
                            transparent 0px,
                            transparent 24px,
                            rgba(255,255,255,0.08) 25px,
                            rgba(255,255,255,0.18) 26px,
                            transparent 28px,
                            transparent 52px,
                            rgba(255, 24, 24, 0.22) 53px,
                            rgba(255, 24, 24, 0.55) 55px,
                            rgba(255, 24, 24, 0.18) 58px,
                            transparent 60px,
                            transparent 96px
                        );
        
                    animation:
                        remoteRedBarsA 0.13s steps(2, end) infinite;
                }
        
                body.remote-glitch::after {
                    top: 0;
                    height: 100vh;
        
                    background:
                        linear-gradient(
                            to bottom,
                            transparent 0%,
                            transparent 8%,
        
                            rgba(255,255,255,0.92) 8.1%,
                            rgba(255,255,255,0.92) 8.45%,
                            transparent 8.7%,
        
                            transparent 16%,
                            rgba(255, 18, 18, 0.98) 16.1%,
                            rgba(255, 18, 18, 0.98) 17.25%,
                            transparent 17.55%,
        
                            transparent 36%,
                            rgba(255,255,255,0.72) 36.15%,
                            rgba(255,255,255,0.72) 36.55%,
                            transparent 36.85%,
        
                            transparent 48%,
                            rgba(255, 32, 32, 0.88) 48.2%,
                            rgba(255, 32, 32, 0.88) 49.4%,
                            transparent 49.7%,
        
                            transparent 71%,
                            rgba(255, 10, 10, 0.94) 71.15%,
                            rgba(255, 10, 10, 0.94) 72.35%,
                            transparent 72.65%,
        
                            transparent 84%,
                            rgba(255,255,255,0.78) 84.1%,
                            rgba(255,255,255,0.78) 84.45%,
                            transparent 84.8%,
        
                            transparent 100%
                        );
        
                    box-shadow:
                        inset 0 0 60px rgba(255, 0, 0, 0.10);
        
                    animation:
                        remoteRedBarsB 0.09s steps(2, end) infinite;
                }
        
                body.remote-glitch .terminal-window,
        body.remote-glitch header,
        body.remote-glitch footer {
                    animation:
                        remoteArchiveJolt 0.075s steps(2, end) infinite;
        
                    text-shadow:
                        -1px 0 rgba(255, 40, 40, 0.85),
                        1px 0 rgba(255,255,255,0.22);
                }
        
                body.remote-glitch .scanlines {
                    opacity: 0.20;
                }
        
                body.remote-glitch .terminal-flicker {
                    opacity: 0.12;
                    background:
                        rgba(255,255,255,0.08);
                }
        
                @keyframes remoteGlitchShake {
                    0%   { transform: translate(0, 0); }
                    15%  { transform: translate(-7px, 1px); }
                    30%  { transform: translate(5px, -2px); }
                    45%  { transform: translate(-3px, 3px); }
                    60%  { transform: translate(8px, -1px); }
                    75%  { transform: translate(-4px, 2px); }
                    100% { transform: translate(0, 0); }
                }
        
                @keyframes remoteArchiveJolt {
                    0%, 100% {
                        transform: translateX(0);
                        filter: brightness(1);
                    }
        
                    28% {
                        transform: translateX(-4px);
                        filter: brightness(1.18);
                    }
        
                    55% {
                        transform: translateX(3px);
                        filter: brightness(0.92);
                    }
        
                    76% {
                        transform: translateX(-2px);
                        filter: brightness(1.10);
                    }
                }
        
                @keyframes remoteRedBarsA {
                    0% {
                        transform:
                            translateY(-12px)
                            scaleY(1);
                        opacity: 0.50;
                    }
        
                    24% {
                        transform:
                            translateY(20px)
                            scaleY(0.7);
                        opacity: 1;
                    }
        
                    48% {
                        transform:
                            translateY(-16px)
                            scaleY(1.35);
                        opacity: 0.72;
                    }
        
                    73% {
                        transform:
                            translateY(9px)
                            scaleY(0.86);
                        opacity: 1;
                    }
        
                    100% {
                        transform:
                            translateY(0)
                            scaleY(1);
                        opacity: 0.58;
                    }
                }
        
                @keyframes remoteRedBarsB {
                    0% {
                        transform: translateX(-4%);
                        opacity: 0.58;
                    }
        
                    26% {
                        transform: translateX(3%);
                        opacity: 1;
                    }
        
                    51% {
                        transform: translateX(-2%);
                        opacity: 0.72;
                    }
        
                    76% {
                        transform: translateX(5%);
                        opacity: 0.94;
                    }
        
                    100% {
                        transform: translateX(0);
                        opacity: 0.66;
                    }
                }
        
        
                body.remote-blackout {
                    background: #000;
        
                    animation:
                        remoteBlackoutBody 0.11s steps(2, end) 3;
                }
        
                body.remote-blackout .archive,
                body.remote-blackout .terminal-flicker,
                body.remote-blackout .vignette,
                body.remote-blackout .scanlines {
                    opacity: 0 !important;
                }
        
                body.remote-blackout::before {
                    content: "";
        
                    position: fixed;
                    inset: 0;
        
                    z-index: 10000;
        
                    background: #000;
        
                    pointer-events: none;
        
                    animation:
                        remoteBlackoutCut 1.8s linear forwards;
                }
        
                body.remote-blackout::after {
                    content: "";
        
                    position: fixed;
                    inset: 0;
        
                    z-index: 10001;
        
                    pointer-events: none;
        
                    background:
                        linear-gradient(
                            to bottom,
                            transparent 0%,
                            transparent 46%,
                            rgba(255,255,255,0.14) 46.1%,
                            rgba(255,255,255,0.14) 46.35%,
                            transparent 46.6%,
        
                            transparent 77%,
                            rgba(255, 16, 16, 0.18) 77.1%,
                            rgba(255, 16, 16, 0.18) 77.45%,
                            transparent 77.7%
                        );
        
                    opacity: 0;
        
                    animation:
                        remoteBlackoutGhostLines 1.8s linear forwards;
                }
        
                @keyframes remoteBlackoutBody {
                    0%   { filter: brightness(1); }
                    50%  { filter: brightness(0.18); }
                    100% { filter: brightness(1); }
                }
        
                @keyframes remoteBlackoutCut {
                    0%   { opacity: 0; }
                    3%   { opacity: 0.28; }
                    5%   { opacity: 0.02; }
                    8%   { opacity: 0.68; }
                    11%  { opacity: 0.12; }
                    15%  { opacity: 1; }
                    92%  { opacity: 1; }
                    96%  { opacity: 0.96; }
                    98%  { opacity: 1; }
                    100% { opacity: 0; }
                }
        
                @keyframes remoteBlackoutGhostLines {
                    0%,
                    12% {
                        opacity: 0;
                    }
        
                    13% {
                        opacity: 0.9;
                    }
        
                    16% {
                        opacity: 0;
                    }
        
                    91% {
                        opacity: 0;
                    }
        
                    93% {
                        opacity: 0.5;
                    }
        
                    95% {
                        opacity: 0;
                    }
        
                    100% {
                        opacity: 0;
                    }
                }
        
        
                body.remote-distortion {
                    animation:
                        remoteDistortionShake 0.045s steps(2, end) infinite,
                        ambientBrightness 12s ease-in-out infinite;
        
                    filter:
                        contrast(1.26)
                        brightness(1.08);
                }
        
                body.remote-distortion .terminal-window,
        body.remote-distortion header,
        body.remote-distortion footer {
                    animation:
                        remoteDistortionSplit 0.065s steps(2, end) infinite;
        
                    text-shadow:
                        -3px 0 rgba(255, 20, 20, 0.95),
                        3px 0 rgba(255,255,255,0.30);
        
                    filter:
                        contrast(1.14);
                }
        
                body.remote-distortion::before,
                body.remote-distortion::after {
                    content: "";
        
                    position: fixed;
                    inset: 0;
        
                    pointer-events: none;
                }
        
                body.remote-distortion::before {
                    z-index: 9997;
        
                    background:
                        repeating-linear-gradient(
                            to bottom,
                            transparent 0px,
                            transparent 5px,
                            rgba(255,255,255,0.09) 6px,
                            rgba(255,255,255,0.03) 7px,
                            transparent 8px
                        );
        
                    animation:
                        remoteDistortionNoise 0.055s steps(2, end) infinite;
                }
        
                body.remote-distortion::after {
                    z-index: 9999;
        
                    background:
                        linear-gradient(
                            to bottom,
        
                            transparent 0%,
                            transparent 12%,
                            rgba(255,255,255,0.82) 12.1%,
                            rgba(255,255,255,0.82) 12.5%,
                            transparent 12.75%,
        
                            transparent 28%,
                            rgba(255, 22, 22, 0.92) 28.1%,
                            rgba(255, 22, 22, 0.92) 29.15%,
                            transparent 29.45%,
        
                            transparent 52%,
                            rgba(255,255,255,0.58) 52.1%,
                            rgba(255,255,255,0.58) 52.55%,
                            transparent 52.8%,
        
                            transparent 68%,
                            rgba(255, 18, 18, 0.88) 68.1%,
                            rgba(255, 18, 18, 0.88) 69.4%,
                            transparent 69.7%,
        
                            transparent 88%,
                            rgba(255,255,255,0.72) 88.1%,
                            rgba(255,255,255,0.72) 88.5%,
                            transparent 88.8%,
        
                            transparent 100%
                        );
        
                    box-shadow:
                        inset 0 0 80px rgba(255, 0, 0, 0.08);
        
                    animation:
                        remoteDistortionSlice 0.075s steps(2, end) infinite;
                }
        
                body.remote-distortion .section {
                    border-color:
                        rgba(255,255,255,0.20);
                }
        
                body.remote-distortion .scanlines {
                    opacity: 0.22;
                }
        
                @keyframes remoteDistortionShake {
                    0% {
                        transform:
                            translate(0, 0)
                            skewX(0deg);
                    }
        
                    20% {
                        transform:
                            translate(-5px, 1px)
                            skewX(-0.7deg);
                    }
        
                    40% {
                        transform:
                            translate(6px, -2px)
                            skewX(0.8deg);
                    }
        
                    60% {
                        transform:
                            translate(-2px, 3px)
                            skewX(-0.35deg);
                    }
        
                    80% {
                        transform:
                            translate(4px, -1px)
                            skewX(0.45deg);
                    }
        
                    100% {
                        transform:
                            translate(0, 0)
                            skewX(0deg);
                    }
                }
        
                @keyframes remoteDistortionSplit {
                    0%,
                    100% {
                        transform: translate(0, 0);
                        filter:
                            contrast(1)
                            brightness(1);
                    }
        
                    22% {
                        transform: translate(-6px, 0);
                        filter:
                            contrast(1.30)
                            brightness(1.16);
                    }
        
                    49% {
                        transform: translate(5px, 1px);
                        filter:
                            contrast(1.12)
                            brightness(0.94);
                    }
        
                    73% {

<script>


    /*
    ============================================================
    STATE STORAGE
    ============================================================
    */


    const RETRIEVED_KEY =
        "meridian_retrieved_ids";

    const UNREDACTED_KEY =
        "meridian_unredacted_ids";

    const STATUS_KEY =
        "meridian_status";

    const MEMORY_KEY =
        "meridian_memory";

    const LOCKOUT_KEY =
        "meridian_global_lockout";

    const RECALL_KEY =
        "meridian_recall_available";

    const RESTORED_M05_KEY =
        "meridian_restored_m05";

    const RESTORED_M06_KEY =
        "meridian_restored_m06";


    /*
    ============================================================
    VALID RETRIEVE IDENTIFIERS
    ============================================================
    */

    const retrievableRecords = [

        "F52C8A19",
        "C84A17D2",
        "A0057E31",
        "A6E91B42",
        "SYS002D91",
        "SYS003E52",
        "SYS004B63"

    ];


    /*
    ============================================================
    VALID UNREDACT IDENTIFIERS
    ============================================================
    */

    const unredactableRecords = [

        "B6E2049F",
        "C84A17D2",
        "19C7B2E5",
        "A4D17C92",
        "B0028F14"

    ];


    /*
    ============================================================
    VALID RESTORE IDENTIFIERS
    ============================================================
    */

    const restorableRecords = {

        "XnV46Q": "M05",
        "0tV6eY": "M06"

    };


    /*
    ============================================================
    STATE HELPERS
    ============================================================
    */

    function getStoredArray(key) {

        try {

            const value =
                localStorage.getItem(key);

            if (!value) {
                return [];
            }

            const parsed =
                JSON.parse(value);

            if (!Array.isArray(parsed)) {
                return [];
            }

            return parsed;

        } catch (error) {

            return [];

        }

    }


    function saveStoredArray(key, array) {

        localStorage.setItem(
            key,
            JSON.stringify(array)
        );

    }


    function addToStoredArray(key, value) {

        const values =
            getStoredArray(key);

        if (!values.includes(value)) {

            values.push(value);

            saveStoredArray(
                key,
                values
            );

        }

    }


    /*
    ============================================================
    STATUS SYSTEM
    ============================================================
    */

    const statusEntries = {

        default: [

            "SYSTEM STATUS: ACTIVE",
            "MEMORY: LOCKED",
            "QUERY: AVAILABLE",
            "COMMAND INTERFACE: ACTIVE"

        ],

        stage_01: [

            "SYSTEM STATUS: ACTIVE",
            "MEMORY: LOCKED",
            "RECORD INDEX: INCOMPLETE",
            "PERSISTENT STATE: UNCHANGED"

        ],

        stage_02: [

            "SYSTEM STATUS: ACTIVE",
            "MEMORY: LOCKED",
            "UNAUTHORISED ACCESS DETECTED",
            "SOURCE: UNKNOWN"

        ],

        stage_03: [

            "SYSTEM STATUS: ACTIVE",
            "QUERY: DEGRADED",
            "TRACE: PARTIAL",
            "RECORD INTEGRITY: UNKNOWN"

        ]

    };


    /*
    ============================================================
    COMMANDS
    ============================================================
    */

    const commands = {


        /*
        ========================================================
        HELP
        ========================================================
        */

        help: function () {

            return {

                type: "system",

                lines: [

                    "AVAILABLE COMMANDS:",
                    "",
                    "STATUS",
                    "REDACT [IDENTIFIER]"

                ]

            };

        },


        /*
        ========================================================
        STATUS
        ========================================================
        */

        status: function () {

            const currentStatus =
                localStorage.getItem(
                    STATUS_KEY
                ) || "default";


            const lines =
                statusEntries[currentStatus];


            if (!lines) {

                return {

                    type: "system",

                    lines:
                        statusEntries.default

                };

            }


            return {

                type: "system",

                lines: lines

            };

        },


        /*
        ========================================================
        RETRIEVE
        ========================================================
        */

        retrieve: function (identifier) {


            if (!identifier) {

                return {

                    type: "error",

                    lines: [

                        "RETRIEVE REQUIRES IDENTIFIER."

                    ]

                };

            }


            identifier =
                identifier.toUpperCase();


            if (
                !retrievableRecords.includes(
                    identifier
                )
            ) {

                return {

                    type: "error",

                    lines: [

                        "RECORD NOT FOUND."

                    ]

                };

            }


            addToStoredArray(
                RETRIEVED_KEY,
                identifier
            );


            return {

                type: "system",

                lines: [

                    "RETRIEVAL REQUEST ACCEPTED.",
                    "",
                    "IDENTIFIER: " + identifier,
                    "RECORD STATE: AVAILABLE"

                ]

            };

        },


        /*
        ========================================================
        REDACT
        ========================================================
        */

        redact: function () {

            return {

                type: "error",

                lines: [

                    "REDACTION PROTOCOL: ACTIVE.",
                    "OPERATION NOT AVAILABLE FROM CURRENT INTERFACE."

                ]

            };

        },


        /*
        ========================================================
        UNREDACT
        ========================================================
        */

        unredact: function (identifier) {


            if (!identifier) {

                return {

                    type: "error",

                    lines: [

                        "UNREDACT REQUIRES TARGET."

                    ]

                };

            }


            identifier =
                identifier.toUpperCase();


            if (
                !unredactableRecords.includes(
                    identifier
                )
            ) {

                return {

                    type: "error",

                    lines: [

                        "RECORD NOT FOUND."

                    ]

                };

            }


            addToStoredArray(
                UNREDACTED_KEY,
                identifier
            );


            return {

                type: "system",

                lines: [

                    "UNREDACTION REQUEST ACCEPTED.",
                    "",
                    "IDENTIFIER: " + identifier,
                    "REDACTION STATE: REMOVED"

                ]

            };

        },


        /*
        ========================================================
        TRACE
        ========================================================
        */

        trace: function (location) {


            if (!location) {

                return {

                    type: "error",

                    lines: [

                        "TRACE REQUIRES LOCATION."

                    ]

                };

            }


            location =
                location.toLowerCase();


            /*
            ----------------------------------------------------
            /channel
            ----------------------------------------------------
            */

            if (location === "/channel") {

                return {

                    type: "system",

                    lines: [

                        "TRACE REQUEST ACCEPTED.",
                        "",
                        "============================================================",
                        "MERIDIAN TRACE REPORT",

            if (target === "M06") {

    /*

    function getOutputDelay(line) {

        if (line.trim() === "") {

            return 50 + Math.random() * 100;

        }


        const roll =
            Math.random();


        if (roll < 0.70) {

            return 50 + Math.random() * 200;

        }


        if (roll < 0.90) {

            return 250 + Math.random() * 550;

        }


        if (roll < 0.98) {

            return 800 + Math.random() * 1200;

        }


        return 2000 + Math.random() * 3000;

    }


    /*
    ============================================================
    DISPLAY TERMINAL OUTPUT
    ============================================================
    */

    async function displayOutput(lines, type) {

        for (const line of lines) {


            const delay =
                getOutputDelay(line);


            await new Promise(
                function (resolve) {

                    setTimeout(
                        resolve,
                        delay
                    );

                }
            );


            const outputLine =
                document.createElement(
                    "div"
                );


            outputLine.className =
                "output-line " +
                (
                    type === "error"
                        ? "error-line"
                        : "system-line"
                );


            outputLine.textContent =
                line;


            output.appendChild(
                outputLine
            );


            output.scrollTop =
                output.scrollHeight;

        }

    }

    ============================================================
    RESET REBOOT
    ============================================================
    */

    async function performResetReboot() {


        document.body.classList.add(
            "reset-glitch"

        await new Promise(
            function (resolve) {

                setTimeout(
                    resolve,
                    1100
                );

        document.body.classList.remove(

        document.body.classList.add(

        await new Promise(
            function (resolve) {

                setTimeout(
                    resolve,
                    900
                );

            }
        );


        window.location.reload();

    }


    /*
    ============================================================
    COMMAND INPUT
    ============================================================
    */

    const input =
        document.getElementById(
            "command-input"
        );

    const output =
        document.getElementById(
            "terminal-output"
        );


    input.addEventListener(
        "keydown",
        async function (event) {


            if (event.key !== "Enter") {
                return;
            }


            const rawCommand =
                input.value.trim();


            if (rawCommand === "") {
                return;
            }


            /*
            ----------------------------------------------------
            DISPLAY ENTERED COMMAND IMMEDIATELY
            ----------------------------------------------------
            */

            const commandLine =
                document.createElement(
                    "div"
                );


            commandLine.className =
                "output-line command-line";


            commandLine.textContent =
                "> " + rawCommand;


            output.appendChild(
                commandLine
            );


            /*
            ----------------------------------------------------
            CLEAR INPUT
            ----------------------------------------------------
            */

            input.value = "";


            /*
            ----------------------------------------------------
            PARSE COMMAND
            ----------------------------------------------------
            */

            const parts =
                rawCommand.split(
                    /\s+/
                );


            const command =
                parts[0].toLowerCase();


            const argument =
                parts.length > 1
                    ? parts[1]
                    : null;


            /*
            ----------------------------------------------------
            MEMORY GATE
            ----------------------------------------------------
            */

            const memoryActive =
                localStorage.getItem(
                    MEMORY_KEY
                ) === "true";


            let result;


            if (
                (
                    command === "restore" ||
                    command === "reset"
                ) &&
                !memoryActive
            ) {

                result = {

                    type: "error",

                    lines: [

                        "UNKNOWN COMMAND."

                    ]

                };

            }


            /*
            ----------------------------------------------------
            NORMAL COMMAND PROCESSING
            ----------------------------------------------------
            */

            else if (commands[command]) {

                result =
                    commands[command](
                        argument
                    );

            }


            /*
            ----------------------------------------------------
            UNKNOWN COMMAND
            ----------------------------------------------------
            */

            else {

                result = {

                    type: "error",

                    lines: [

                        "UNKNOWN COMMAND."

                    ]

                };

            }


            /*
            ----------------------------------------------------
            DISPLAY RESPONSE
            ----------------------------------------------------
            */

            await displayOutput(
                result.lines,
                result.type
            );


            /*
            ----------------------------------------------------
            RESET REBOOT

            Only starts AFTER the complete reset dump.
            ----------------------------------------------------
            */

            if (
                command === "reset" &&
                memoryActive &&
                result.lines[0] ===
                    "SYSTEM RESET REQUEST ACCEPTED."
            ) {

                performResetReboot();

            }


            /*
            ----------------------------------------------------
            SCROLL TO BOTTOM
            ----------------------------------------------------
            */

            output.scrollTop =
                output.scrollHeight;

        }
    );


    /*
    ============================================================
    BACK TO MERIDIAN
    ============================================================
    */

    function goBack() {

        window.location.href =
            "../index.html";

    }

    const eventRef =
        ref(
            database,
            "meridian/event"
        );


    let lastRemoteEventId = null;
    let remoteListenerInitialised = false;


    onValue(
        eventRef,
        snapshot => {

            const event =

                remoteListenerInitialised =

                return;

            /*
             * Firebase immediately returns the currently
             * stored event when this listener first connects.

             * Remember it, but do not play it.

            if (!remoteListenerInitialised) {

                    event.id;

                remoteListenerInitialised =

            /*

            if (
                event.id ===
                lastRemoteEventId

                return;

            lastRemoteEventId =
                event.id;

                event

    function handleRemoteEvent(event) {

        switch (event.type) {

            case "glitch":
                triggerRemoteGlitch();

            case "blackout":
                triggerRemoteBlackout();
                break;

            case "flash":
            case "distortion":
                triggerRemoteDistortion();
                break;

            case "snow":
            case "static":
                triggerRemoteSnow();

    let remoteReloadInterval = null;


    function triggerRemoteReloadLockout() {

        /*
         * Once the terminal has reached the permanent black state,
         * remote effects cannot revive it. A real page reload is required.
         */
        if (
            document.body.classList.contains(
                "remote-dead-black"
            )
        ) {
            return;
        }


        clearRemoteVfx();

        if (remoteReloadInterval) {

            clearInterval(
                remoteReloadInterval

            remoteReloadInterval = null;

        const timer =
            document.getElementById(
                "remoteReloadTimer"

        const durationSeconds =

            String(remaining).padStart(

                "0"

        void document.body.offsetWidth;


        document.body.classList.add(
            "remote-reload-lockout"

        remoteReloadInterval =

                    timer.textContent =
                        "00:" +
                        String(
                            Math.max(
                                remaining,
                                0
                            )
                        ).padStart(
                            2,
                            "0"
                        );


                    if (
                        remaining <= 0
                    ) {

                        clearInterval(
                            remoteReloadInterval
                        );

                        remoteReloadInterval =
                            null;


                        document.body.classList.remove(
                            "remote-reload-lockout"

                        /*

                         * this document. Reloading the page recreates

                        document.body.classList.add(

                ) + "px"
            );


            layer.appendChild(
                heart
            );

        }


        void document.body.offsetWidth;


        document.body.classList.add(
            "remote-hearts"
        );


        remoteHeartTimeout =
            setTimeout(
                () => {

                    document.body.classList.remove(
                        "remote-hearts"
                    );


                    layer.innerHTML =
                        "";


                    remoteHeartTimeout =
                        null;

                },
                7200
            );

    }


</script>
