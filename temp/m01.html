/* =========================================================
   M01 INTERFACE POLISH

/* ---------------------------------------------------------
   SUBTLE SCREEN TEXTURE

   No glow. Just a very faint CRT/terminal-like texture.
--------------------------------------------------------- */

body::after {
    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1000;

    opacity: 0.035;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,0.025) 4px,
            transparent 5px
        );
}


/* ---------------------------------------------------------
   HEADER

   Very occasional scan travelling across the header.
--------------------------------------------------------- */

header {
    position: relative;

    overflow: hidden;
}


header::after {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    left: -15%;

    width: 10%;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(255,255,255,0.025),
            transparent
        );

    animation:
        headerScan
        18s
        linear
        infinite;
}


@keyframes headerScan {

    0%,
    82% {
        left: -15%;
        opacity: 0;
    }

    83% {
        opacity: 1;
    }

    89% {
        left: 110%;
        opacity: 1;
    }

    90%,
    100% {
        left: 110%;
        opacity: 0;
    }

}


/* ---------------------------------------------------------
   LOGO

   Almost imperceptible terminal flicker.
--------------------------------------------------------- */

.logo {
    animation:
        logoFlicker
        14s
        linear
        infinite;
}


@keyframes logoFlicker {

    0%,
    92%,
    93%,
    100% {
        opacity: 1;
    }

    92.2% {
        opacity: 0.82;
    }

    92.35% {
        opacity: 1;
    }

    92.55% {
        opacity: 0.91;
    }

}


/* ---------------------------------------------------------
   RECORD SIDEBAR
--------------------------------------------------------- */

.record {
    position: relative;

    transition:
        background 0.15s ease,
        padding-left 0.15s ease,
        color 0.15s ease;
}


/*
 * Tiny indicator on hover.
 */

.record::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 2px;
    height: 100%;

    background: #666;

    transform: scaleY(0);

    transform-origin: center;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}


.record:hover {
    background: #1c1c1c;

    padding-left: 24px;
}


.record:hover::before {
    transform: scaleY(0.45);
}


/*
 * Active record.
 */

.record.active {
    background: #202020;

    border-left: none;

    padding-left: 24px;
}


.record.active::before {
    background: #aaa;

    transform: scaleY(1);
}


.record.active .record-number {
    color: #ddd;
}


/* ---------------------------------------------------------
   RECORD NUMBER
--------------------------------------------------------- */

.record-number {
    transition:
        color 0.15s ease,
        letter-spacing 0.15s ease;
}


.record:hover .record-number {
    color: #c4c4c4;
}


/* ---------------------------------------------------------
   VIEWER
--------------------------------------------------------- */

.viewer {
    position: relative;
}


/*
 * Very faint top/bottom depth.
 *
 * This is NOT a glow — just slightly darkens the edges
 * of the scrollable document area.
 */

.viewer::before {
    content: "";

    position: fixed;

    pointer-events: none;

    z-index: 5;

    opacity: 0.3;
}


/* ---------------------------------------------------------
   RECORD OPEN ANIMATION
--------------------------------------------------------- */

.record-view {
    animation:
        recordOpen
        0.24s
        ease-out;
}


@keyframes recordOpen {

    from {
        opacity: 0;

        transform:
            translateY(3px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}


/* ---------------------------------------------------------
   HEADING
--------------------------------------------------------- */

.record-heading {
    position: relative;

    padding-bottom: 4px;
}


.record-heading::after {
    content: "";

    position: absolute;

    left: 0;

    bottom: -7px;

    width: 24px;

    height: 1px;

    background: #555;
}


/* ---------------------------------------------------------
   RECORD ID
--------------------------------------------------------- */

.record-id {
    transition:
        color 0.2s ease;
}


.record-view:hover .record-id {
    color: #777;
}


/* ---------------------------------------------------------
   METADATA
--------------------------------------------------------- */

.metadata-value {
    transition:
        color 0.15s ease;
}


.metadata:hover .metadata-value {
    color: #b5b5b5;
}


/* ---------------------------------------------------------
   RECORD CONTENT
--------------------------------------------------------- */

.record-content {
    text-rendering:
        optimizeLegibility;
}


/* ---------------------------------------------------------
   POLYDATE

--------------------------------------------------------- */

.polydate {

        ease-in-out
        infinite;

@keyframes polydatePulse {

    0%,

        color: #666;

    50% {

    }

/* ---------------------------------------------------------
   REDACTION TEXTURE

--------------------------------------------------------- */

.redacted-line,

/* ---------------------------------------------------------

--------------------------------------------------------- */

.record-list::-webkit-scrollbar,

.record-list::-webkit-scrollbar-thumb:hover,

    background: #555;
}


.record-list,
.viewer {
    scrollbar-width: thin;

    scrollbar-color:
        #3b3b3b
        #141414;
}


/* ---------------------------------------------------------
   EMPTY STATE
--------------------------------------------------------- */

.empty-state {
    animation:
        emptyStatePulse
        5s
        ease-in-out
        infinite;
}


@keyframes emptyStatePulse {

    0%,
    100% {
        opacity: 0.7;
    }

    50% {
        opacity: 1;
    }

}


/* ---------------------------------------------------------
   ACCESSIBILITY

   Disable motion for users who request reduced motion.
--------------------------------------------------------- */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation: none !important;

        transition: none !important;
    }

}

        /*
        ============================================================
        STATE
        ============================================================
        */

        let selectedRecord = null;



        /*
        ============================================================
        RETRIEVED RECORD STATE
        ============================================================
        */

        function getRetrievedIds() {

            try {

                const stored =
                    localStorage.getItem(
                        "meridian_retrieved_ids"
                    );

                if (!stored) {
                    return [];
                }

                const parsed =
                    JSON.parse(stored);

                return Array.isArray(parsed)
                    ? parsed
                    : [];

            } catch (error) {

                return [];

            }

        }



        /*
        ============================================================
        UNREDACTED RECORD STATE
        ============================================================
        */

        function getUnredactedIds() {

            try {

                const stored =
                    localStorage.getItem(
                        "meridian_unredacted_ids"
                    );

                if (!stored) {
                    return [];
                }

                const parsed =
                    JSON.parse(stored);

                return Array.isArray(parsed)
                    ? parsed
                    : [];

            } catch (error) {

                return [];

            }

        }



        /*
        ============================================================
        MEMORY STATE
        ============================================================
        */

        function isMemoryActive() {

            return (
                localStorage.getItem(
                    "meridian_memory"
                ) === "true"
            );

        }



        /*
        ============================================================
        RECORD VISIBILITY
        ============================================================
        */

        function isRecordVisible(record) {

            /*
            MEMLOCKED records require MEMORY to be active.

            Once MEMORY is active, memlocked records are treated
            like ordinary records and continue through the normal
            hidden/retrieval checks below.
            */

            if (
                record.memlocked &&
                !isMemoryActive()
            ) {

                return false;

            }



            /*
            Normal records are always visible.

            This also applies to memlocked records once MEMORY
            has been activated.
            */

            if (!record.hidden) {

                return true;

            }



            /*
            Hidden records require their specific identifier
            to have been retrieved through M02.

            This remains true even after MEMORY is activated.
            */

            const retrievedIds =
                getRetrievedIds();



            return retrievedIds.some(
                id =>
                    String(id).toUpperCase() ===
                    String(record.id).toUpperCase()
            );

        }



        /*
        ============================================================
        RECORD REDACTION
        ============================================================
        */

        function isRecordUnredacted(record) {

            /*
            Records without redaction require no special state.
            */

            if (!record.redacted) {

                return true;

            }



            /*
            Redacted records require their specific identifier
            to have been supplied to UNREDACT through M02.
            */

            const unredactedIds =
                getUnredactedIds();



            return unredactedIds.some(
                id =>
                    String(id).toUpperCase() ===
                    String(record.id).toUpperCase()
            );

        }



        /*
        ============================================================
        RENDER SIDEBAR
        ============================================================
        */

        function renderSidebar() {

            const recordList =
                document.querySelector(
                    ".record-list"
                );



            recordList.innerHTML = `

                <div class="list-header">
                    RECORDS
                </div>

            `;



            Object.keys(records).forEach(key => {

                const record =
                    records[key];



                /*
                Only display records whose current
                persistent state permits access.
                */

                if (!isRecordVisible(record)) {

                    return;

                }



                const element =
                    document.createElement("div");



                element.className =
                    "record";



                if (
                    selectedRecord ===
                    Number(key)
                ) {

                    element.classList.add(
                        "active"
                    );

                }



                element.innerHTML = `

                    <div class="record-number">
                        ${record.title}
                    </div>

                `;



                element.addEventListener(
                    "click",
                    () => {

                        selectedRecord =
                            Number(key);

                        renderSidebar();

                        openRecord(record);

                    }
                );



                recordList.appendChild(
                    element
                );

            });

        }



        /*
        ============================================================
        OPEN RECORD
        ============================================================
        */

        function openRecord(record) {

            /*
            Make sure a record cannot be opened through
            stale UI state after its access conditions change.
            */

            if (!isRecordVisible(record)) {

                selectedRecord = null;



                viewer.innerHTML = `

                    <div class="empty-state">
                        SELECT A RECORD
                    </div>

                `;



                renderSidebar();

                return;

            }



            let displayedContent =
                record.content;



            /*
            Use the redacted version unless this
            specific record has been unredacted.

            MEMLOCK has no effect on redaction itself.
            Once MEMORY is active, the record follows the
            exact same redaction rules as any other record.
            */

            if (
                record.redacted &&
                !isRecordUnredacted(record)
            ) {

                displayedContent =
                    record.redactedContent ||
                    record.content;

            }



            const polydateHTML =
                record.polydate

                    ? `

                        <div class="polydate">
                            ${record.polydate}
                        </div>

                    `

                    : "";



            viewer.innerHTML = `

                <div class="record-view">


                    <div class="record-heading">

                        ${record.title}

                        <span class="record-id">
                            ${record.id}
                        </span>

                    </div>



                    <div class="metadata">


                        <div class="metadata-label">
                            SUBJECT
                        </div>

                        <div class="metadata-value">
                            ${record.subject}
                        </div>



                        <div class="metadata-label">
                            DATE
                        </div>

                        <div class="metadata-value">
                            ${record.date}
                        </div>



                        <div class="metadata-label">
                            STATUS
                        </div>

                        <div class="metadata-value">
                            ${record.status}
                        </div>


                    </div>



                    <div class="record-content">
                        ${displayedContent}
                    </div>



                    ${polydateHTML}


                </div>

            `;

        }



        /*
        ============================================================
        INITIALISE
        ============================================================
        */

        const viewer =
            document.querySelector(
                ".viewer"
            );



        renderSidebar();

        ============================================================
        GO BACK

            window.location.href =

        }

    </script>
