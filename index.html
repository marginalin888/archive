<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meridian — Access Terminal</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;

            width: 100%;
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            background: #111;

            color: #ddd;

            font-family:
                "Courier New",
                monospace;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            animation:
                ambientBrightness
                12s
                ease-in-out
                infinite;
        }


        /* =========================================================
           ARCHIVE
        ========================================================= */

        .archive {
            position: relative;

            z-index: 10;

            width: 90%;

            max-width: 700px;

            text-align: center;
        }


        h1 {
            margin: 0;

            font-size: 42px;

            font-weight: normal;

            letter-spacing: 8px;

            color: #ddd;
        }


        .subtitle {
            margin-top: 8px;

            margin-bottom: 35px;

            color: #777;

            font-size: 14px;

            letter-spacing: 3px;
        }


        hr {
            border: none;

            border-top: 1px solid #444;

            margin: 25px 0;
        }


        /* =========================================================
           SECTIONS
        ========================================================= */

        .section {
            display: block;

            position: relative;

            padding: 16px;

            margin: 10px 0;

            border: 1px solid #333;

            background:
                rgba(
                    17,
                    17,
                    17,
                    0.65
                );

            color: #aaa;

            text-decoration: none;

            transition:
                border-color 0.15s ease,
                background 0.15s ease,
                color 0.15s ease,
                transform 0.15s ease;
        }


        .section:hover {
            border-color: #777;

            background: #1b1b1b;

            color: #fff;

            transform:
                translateX(2px);
        }


        .section.available {
            color: #ddd;
        }


        .section.locked {
            color: #555;

            border-color: #292929;

            cursor: default;

            pointer-events: none;
        }


        /* =========================================================
           M04 LOCKOUT DISPLAY
        ========================================================= */

        #memory-section.lockout-active {
            border-color: #463737;

            color: #aa8c8c;

            background:
                rgba(
                    34,
                    22,
                    22,
                    0.45
                );

            animation:
                lockoutPulse
                4.5s
                ease-in-out
                infinite;
        }


        #memory-section.lockout-active:hover {
            border-color: #705151;

            color: #ceb0b0;

            background:
                rgba(
                    42,
                    26,
                    26,
                    0.65
                );
        }


        @keyframes lockoutPulse {

            0%,
            100% {
                border-color: #463737;
            }

            50% {
                border-color: #593f3f;
            }

        }


        /* =========================================================
           RESTORED SECTIONS
        ========================================================= */

        .restored-section {
            display: none;
        }


        .restored-section.visible {
            display: block;

            animation:
                lateSectionReveal
                0.65s
                ease
                forwards;
        }


        @keyframes lateSectionReveal {

            from {
                opacity: 0;

                transform:
                    translateY(5px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =========================================================
           FOOTER
        ========================================================= */

        .footer {
            margin-top: 30px;

            color: #444;

            font-size: 12px;

            letter-spacing: 2px;
        }


        /* =========================================================
           AMBIENT EFFECTS
        ========================================================= */

        .scanlines {
            position: fixed;

            inset: 0;

            z-index: 100;

            pointer-events: none;

            opacity: 0.055;

            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 3px,
                    rgba(255,255,255,0.025) 4px,
                    transparent 5px
                );
        }


        .vignette {
            position: fixed;

            inset: 0;

            z-index: 90;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 45%,
                    rgba(0,0,0,0.18) 75%,
                    rgba(0,0,0,0.38) 100%
                );
        }


        @keyframes ambientBrightness {

            0%,
            100% {
                filter:
                    brightness(1);
            }

            40% {
                filter:
                    brightness(0.985);
            }

            70% {
                filter:
                    brightness(1.012);
            }

        }


        .terminal-flicker {
            position: fixed;

            inset: 0;

            z-index: 80;

            pointer-events: none;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.018
                );

            opacity: 0;

            animation:
                terminalFlicker
                17s
                linear
                infinite;
        }


        @keyframes terminalFlicker {

            0%,
            93%,
            93.8%,
            95%,
            100% {
                opacity: 0;
            }

            93.2% {
                opacity: 0.45;
            }

            93.35% {
                opacity: 0;
            }

            93.55% {
                opacity: 0.2;
            }

            94.2% {
                opacity: 0.1;
            }

        }


        .section::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            height: 1px;

            width: 0;

            background:
                rgba(
                    170,
                    185,
                    170,
                    0.18
                );

            transition:
                width
                0.25s
                ease;
        }


        .section:hover::after {
            width: 100%;
        }

        
        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (
            max-width: 600px
        ) {

            .archive {
                width:
                    calc(
                        100% - 35px
                    );
            }


            h1 {
                font-size: 32px;

                letter-spacing: 6px;
            }


            .section {
                font-size: 13px;

                padding:
                    15px
                    10px;
            }

        }


        @media (
            prefers-reduced-motion:
            reduce
        ) {

            *,
            *::before,
            *::after {
                animation:
                    none
                    !important;

                transition:
                    none
                    !important;
            }

        }


        /* =========================================================
           REMOTE VFX
           Triggered from the MERIDIAN control page.
           Brighter red/white corruption closer to the reference look.
        ========================================================= */

        body.remote-glitch {
            animation:
                remoteGlitchShake 0.055s steps(2, end) infinite,
                ambientBrightness 12s ease-in-out infinite;

            filter:
                contrast(1.16)
                brightness(1.05);
        }

        body.remote-glitch::before,
        body.remote-glitch::after {
            content: "";
            position: fixed;
            left: 0;
            width: 100vw;
            pointer-events: none;
            z-index: 9998;
            mix-blend-mode: screen;
        }

        body.remote-glitch::before {
            top: 0;
            height: 100vh;

            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 24px,
                    rgba(255,255,255,0.08) 25px,
                    rgba(255,255,255,0.18) 26px,
                    transparent 28px,
                    transparent 52px,
                    rgba(255, 24, 24, 0.22) 53px,
                    rgba(255, 24, 24, 0.55) 55px,
                    rgba(255, 24, 24, 0.18) 58px,
                    transparent 60px,
                    transparent 96px
                );

            animation:
                remoteRedBarsA 0.13s steps(2, end) infinite;
        }

        body.remote-glitch::after {
            top: 0;
            height: 100vh;

            background:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    transparent 8%,

                    rgba(255,255,255,0.92) 8.1%,
                    rgba(255,255,255,0.92) 8.45%,
                    transparent 8.7%,

                    transparent 16%,
                    rgba(255, 18, 18, 0.98) 16.1%,
                    rgba(255, 18, 18, 0.98) 17.25%,
                    transparent 17.55%,

                    transparent 36%,
                    rgba(255,255,255,0.72) 36.15%,
                    rgba(255,255,255,0.72) 36.55%,
                    transparent 36.85%,

                    transparent 48%,
                    rgba(255, 32, 32, 0.88) 48.2%,
                    rgba(255, 32, 32, 0.88) 49.4%,
                    transparent 49.7%,

                    transparent 71%,
                    rgba(255, 10, 10, 0.94) 71.15%,
                    rgba(255, 10, 10, 0.94) 72.35%,
                    transparent 72.65%,

                    transparent 84%,
                    rgba(255,255,255,0.78) 84.1%,
                    rgba(255,255,255,0.78) 84.45%,
                    transparent 84.8%,

                    transparent 100%
                );

            box-shadow:
                inset 0 0 60px rgba(255, 0, 0, 0.10);

            animation:
                remoteRedBarsB 0.09s steps(2, end) infinite;
        }

        body.remote-glitch .archive {
            animation:
                remoteArchiveJolt 0.075s steps(2, end) infinite;

            text-shadow:
                -1px 0 rgba(255, 40, 40, 0.85),
                1px 0 rgba(255,255,255,0.22);
        }

        body.remote-glitch .scanlines {
            opacity: 0.20;
        }

        body.remote-glitch .terminal-flicker {
            opacity: 0.12;
            background:
                rgba(255,255,255,0.08);
        }

        @keyframes remoteGlitchShake {
            0%   { transform: translate(0, 0); }
            15%  { transform: translate(-7px, 1px); }
            30%  { transform: translate(5px, -2px); }
            45%  { transform: translate(-3px, 3px); }
            60%  { transform: translate(8px, -1px); }
            75%  { transform: translate(-4px, 2px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes remoteArchiveJolt {
            0%, 100% {
                transform: translateX(0);
                filter: brightness(1);
            }

            28% {
                transform: translateX(-4px);
                filter: brightness(1.18);
            }

            55% {
                transform: translateX(3px);
                filter: brightness(0.92);
            }

            76% {
                transform: translateX(-2px);
                filter: brightness(1.10);
            }
        }

        @keyframes remoteRedBarsA {
            0% {
                transform:
                    translateY(-12px)
                    scaleY(1);
                opacity: 0.50;
            }

            24% {
                transform:
                    translateY(20px)
                    scaleY(0.7);
                opacity: 1;
            }

            48% {
                transform:
                    translateY(-16px)
                    scaleY(1.35);
                opacity: 0.72;
            }

            73% {
                transform:
                    translateY(9px)
                    scaleY(0.86);
                opacity: 1;
            }

            100% {
                transform:
                    translateY(0)
                    scaleY(1);
                opacity: 0.58;
            }
        }

        @keyframes remoteRedBarsB {
            0% {
                transform: translateX(-4%);
                opacity: 0.58;
            }

            26% {
                transform: translateX(3%);
                opacity: 1;
            }

            51% {
                transform: translateX(-2%);
                opacity: 0.72;
            }

            76% {
                transform: translateX(5%);
                opacity: 0.94;
            }

            100% {
                transform: translateX(0);
                opacity: 0.66;
            }
        }


        body.remote-blackout {
            background: #000;

            animation:
                remoteBlackoutBody 0.11s steps(2, end) 3;
        }

        body.remote-blackout .archive,
        body.remote-blackout .terminal-flicker,
        body.remote-blackout .vignette,
        body.remote-blackout .scanlines {
            opacity: 0 !important;
        }

        body.remote-blackout::before {
            content: "";

            position: fixed;
            inset: 0;

            z-index: 10000;

            background: #000;

            pointer-events: none;

            animation:
                remoteBlackoutCut 1.8s linear forwards;
        }

        body.remote-blackout::after {
            content: "";

            position: fixed;
            inset: 0;

            z-index: 10001;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    transparent 46%,
                    rgba(255,255,255,0.14) 46.1%,
                    rgba(255,255,255,0.14) 46.35%,
                    transparent 46.6%,

                    transparent 77%,
                    rgba(255, 16, 16, 0.18) 77.1%,
                    rgba(255, 16, 16, 0.18) 77.45%,
                    transparent 77.7%
                );

            opacity: 0;

            animation:
                remoteBlackoutGhostLines 1.8s linear forwards;
        }

        @keyframes remoteBlackoutBody {
            0%   { filter: brightness(1); }
            50%  { filter: brightness(0.18); }
            100% { filter: brightness(1); }
        }

        @keyframes remoteBlackoutCut {
            0%   { opacity: 0; }
            3%   { opacity: 0.28; }
            5%   { opacity: 0.02; }
            8%   { opacity: 0.68; }
            11%  { opacity: 0.12; }
            15%  { opacity: 1; }
            92%  { opacity: 1; }
            96%  { opacity: 0.96; }
            98%  { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes remoteBlackoutGhostLines {
            0%,
            12% {
                opacity: 0;
            }

            13% {
                opacity: 0.9;
            }

            16% {
                opacity: 0;
            }

            91% {
                opacity: 0;
            }

            93% {
                opacity: 0.5;
            }

            95% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }


        body.remote-distortion {
            animation:
                remoteDistortionShake 0.045s steps(2, end) infinite,
                ambientBrightness 12s ease-in-out infinite;

            filter:
                contrast(1.26)
                brightness(1.08);
        }

        body.remote-distortion .archive {
            animation:
                remoteDistortionSplit 0.065s steps(2, end) infinite;

            text-shadow:
                -3px 0 rgba(255, 20, 20, 0.95),
                3px 0 rgba(255,255,255,0.30);

            filter:
                contrast(1.14);
        }

        body.remote-distortion::before,
        body.remote-distortion::after {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;
        }

        body.remote-distortion::before {
            z-index: 9997;

            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 5px,
                    rgba(255,255,255,0.09) 6px,
                    rgba(255,255,255,0.03) 7px,
                    transparent 8px
                );

            animation:
                remoteDistortionNoise 0.055s steps(2, end) infinite;
        }

        body.remote-distortion::after {
            z-index: 9999;

            background:
                linear-gradient(
                    to bottom,

                    transparent 0%,
                    transparent 12%,
                    rgba(255,255,255,0.82) 12.1%,
                    rgba(255,255,255,0.82) 12.5%,
                    transparent 12.75%,

                    transparent 28%,
                    rgba(255, 22, 22, 0.92) 28.1%,
                    rgba(255, 22, 22, 0.92) 29.15%,
                    transparent 29.45%,

                    transparent 52%,
                    rgba(255,255,255,0.58) 52.1%,
                    rgba(255,255,255,0.58) 52.55%,
                    transparent 52.8%,

                    transparent 68%,
                    rgba(255, 18, 18, 0.88) 68.1%,
                    rgba(255, 18, 18, 0.88) 69.4%,
                    transparent 69.7%,

                    transparent 88%,
                    rgba(255,255,255,0.72) 88.1%,
                    rgba(255,255,255,0.72) 88.5%,
                    transparent 88.8%,

                    transparent 100%
                );

            box-shadow:
                inset 0 0 80px rgba(255, 0, 0, 0.08);

            animation:
                remoteDistortionSlice 0.075s steps(2, end) infinite;
        }

        body.remote-distortion .section {
            border-color:
                rgba(255,255,255,0.20);
        }

        body.remote-distortion .scanlines {
            opacity: 0.22;
        }

        @keyframes remoteDistortionShake {
            0% {
                transform:
                    translate(0, 0)
                    skewX(0deg);
            }

            20% {
                transform:
                    translate(-5px, 1px)
                    skewX(-0.7deg);
            }

            40% {
                transform:
                    translate(6px, -2px)
                    skewX(0.8deg);
            }

            60% {
                transform:
                    translate(-2px, 3px)
                    skewX(-0.35deg);
            }

            80% {
                transform:
                    translate(4px, -1px)
                    skewX(0.45deg);
            }

            100% {
                transform:
                    translate(0, 0)
                    skewX(0deg);
            }
        }

        @keyframes remoteDistortionSplit {
            0%,
            100% {
                transform: translate(0, 0);
                filter:
                    contrast(1)
                    brightness(1);
            }

            22% {
                transform: translate(-6px, 0);
                filter:
                    contrast(1.30)
                    brightness(1.16);
            }

            49% {
                transform: translate(5px, 1px);
                filter:
                    contrast(1.12)
                    brightness(0.94);
            }

            73% {
                transform: translate(-3px, -1px);
                filter:
                    contrast(1.24)
                    brightness(1.10);
            }
        }

        @keyframes remoteDistortionNoise {
            0% {
                opacity: 0.10;
                transform: translateY(0);
            }

            32% {
                opacity: 0.34;
                transform: translateY(-6px);
            }

            64% {
                opacity: 0.16;
                transform: translateY(4px);
            }

            100% {
                opacity: 0.22;
                transform: translateY(-2px);
            }
        }

        @keyframes remoteDistortionSlice {
            0% {
                transform: translateX(0);
                opacity: 0.56;
            }

            25% {
                transform: translateX(12px);
                opacity: 1;
            }

            50% {
                transform: translateX(-9px);
                opacity: 0.68;
            }

            75% {
                transform: translateX(6px);
                opacity: 0.92;
            }

            100% {
                transform: translateX(0);
                opacity: 0.62;
            }
        }

    </style>

</head>


<body>


    <main class="archive">


        <h1>
            MERIDIAN
        </h1>


        <div class="subtitle">
            ACCESS TERMINAL
        </div>


        <hr>


        <!-- =====================================================
             CORE SECTIONS
        ====================================================== -->


        <a
            class="section available"
            href="temp/m01.html"
        >
            [01] RECORD — AVAILABLE
        </a>


        <a
            class="section available"
            href="temp/m02.html"
        >
            [02] COMMAND — AVAILABLE
        </a>


        <a
            class="section available"
            href="temp/m03.html"
        >
            [03] QUERY — AVAILABLE
        </a>


        <!--
            M04 swaps between normal and lockout versions.
        -->

        <a
            class="section available"
            id="memory-section"
            href="encrypted/m04.html"
        >
            [04] MEMORY — ACCESS PROTECTED
        </a>


        <!-- =====================================================
             RESTORED SECTIONS

             These appear ONLY if their individual RESTORE flag
             has been set by M02.
        ====================================================== -->


        <div
            class="restored-section"
            id="m05-section"
        >

            <a
                class="section available"
                href="encrypted/m05.html"
            >
                [05] VISUAL EVIDENCE — ACCESS PROTECTED
            </a>

        </div>


        <div
            class="restored-section"
            id="m06-section"
        >

            <a
                class="section available"
                href="encrypted/m06.html"
            >
                [06] SEQUENCE — ACCESS PROTECTED
            </a>

        </div>


        <hr>


        <div
            class="footer"
            id="system-footer"
        >
            MERIDIAN SYSTEM // ACCESS TERMINAL
        </div>


    </main>


    <div class="terminal-flicker"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>


    <script>


        /*
        ============================================================
        STATE KEYS
        ============================================================
        */

        const LOCKOUT_KEY =
            "meridian_global_lockout";


        const RESTORED_M05_KEY =
            "meridian_restored_m05";


        const RESTORED_M06_KEY =
            "meridian_restored_m06";


        /* =========================================================
           M04 PATHS
        ========================================================= */

        const M04_NORMAL_PATH =
            "encrypted/m04.html";


        const M04_LOCKOUT_PATH =
            "encrypted/m04lockout.html";


        /* =========================================================
           LOCKOUT STATE
        ========================================================= */

        function isGlobalLockoutActive() {

            const storedValue =
                localStorage.getItem(
                    LOCKOUT_KEY
                );


            if (!storedValue) {

                return false;

            }


            const lockoutUntil =
                Number(
                    storedValue
                );


            /*
             * Support an older temporary boolean state if present.
             */

            if (
                storedValue === "true"
            ) {

                return true;

            }


            /*
             * "false" should definitely not count as lockout.
             */

            if (
                storedValue === "false"
            ) {

                return false;

            }


            if (
                !Number.isFinite(
                    lockoutUntil
                )
            ) {

                localStorage.removeItem(
                    LOCKOUT_KEY
                );


                return false;

            }


            if (
                Date.now() >=
                lockoutUntil
            ) {

                localStorage.removeItem(
                    LOCKOUT_KEY
                );


                return false;

            }


            return true;

        }


        /* =========================================================
           RESTORE STATE
        ========================================================= */

        function isM05Restored() {

            return (
                localStorage.getItem(
                    RESTORED_M05_KEY
                ) === "true"
            );

        }


        function isM06Restored() {

            return (
                localStorage.getItem(
                    RESTORED_M06_KEY
                ) === "true"
            );

        }


        /* =========================================================
           UPDATE M04
        ========================================================= */

        function updateMemorySection() {

            const memorySection =
                document.getElementById(
                    "memory-section"
                );


            const lockoutActive =
                isGlobalLockoutActive();


            if (lockoutActive) {

                memorySection.href =
                    M04_LOCKOUT_PATH;


                memorySection.textContent =
                    "[04] MEMORY — LOCKOUT";


                memorySection.classList.add(
                    "lockout-active"
                );

            }

            else {

                memorySection.href =
                    M04_NORMAL_PATH;


                memorySection.textContent =
                    "[04] MEMORY — ACCESS PROTECTED";


                memorySection.classList.remove(
                    "lockout-active"
                );

            }

        }


        /* =========================================================
           UPDATE M05
        ========================================================= */

        function updateM05Section() {

            const section =
                document.getElementById(
                    "m05-section"
                );


            if (
                isM05Restored()
            ) {

                section.classList.add(
                    "visible"
                );

            }

            else {

                section.classList.remove(
                    "visible"
                );

            }

        }


        /* =========================================================
           UPDATE M06
        ========================================================= */

        function updateM06Section() {

            const section =
                document.getElementById(
                    "m06-section"
                );


            if (
                isM06Restored()
            ) {

                section.classList.add(
                    "visible"
                );

            }

            else {

                section.classList.remove(
                    "visible"
                );

            }

        }


        /* =========================================================
           UPDATE EVERYTHING
        ========================================================= */

        function updateTerminal() {

            updateMemorySection();

            updateM05Section();

            updateM06Section();

        }


        /* =========================================================
           INITIALISE
        ========================================================= */

        updateTerminal();


        /* =========================================================
           PERIODIC CHECK
        ========================================================= */

        setInterval(
            function () {

                updateMemorySection();

                updateM05Section();

            function (event) {

                if (
                    event.key ===
                    LOCKOUT_KEY ||
                    event.key ===
                    RESTORED_M05_KEY ||
                    event.key ===
                    RESTORED_M06_KEY

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


    const firebaseConfig = {
        apiKey: "AIzaSyAYpmII-FnbAhrNtKCZnAtV4nmeS50GsgE",
        authDomain: "meridian-c942b.firebaseapp.com",
        databaseURL: "https://meridian-c942b-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "meridian-c942b",
        storageBucket: "meridian-c942b.firebasestorage.app",
        messagingSenderId: "443298591760",
        appId: "1:443298591760:web:750f2babc66ecc3309c695"
    };


    const app =
        initializeApp(firebaseConfig);

    const database =
        getDatabase(app);

    const eventRef =
        ref(
            database,
            "meridian/event"
        );


    let lastRemoteEventId = null;
    let remoteListenerInitialised = false;


    onValue(
        eventRef,
        snapshot => {

            const event =
                snapshot.val();


            if (!event) {

                remoteListenerInitialised =
                    true;

                return;

            }


            /*
             * Firebase immediately returns the currently
             * stored event when this listener first connects.
             *
             * Remember it, but do not play it.
             */
            if (!remoteListenerInitialised) {

                lastRemoteEventId =
                    event.id;

                remoteListenerInitialised =
                    true;

                return;

            }


            /*
             * Ignore anything already processed.
             */
            if (
                event.id ===
                lastRemoteEventId
            ) {
                return;
            }


            lastRemoteEventId =
                event.id;


            handleRemoteEvent(
                event
            );

        }
    );


    function handleRemoteEvent(event) {

        switch (event.type) {

            case "glitch":
                triggerRemoteGlitch();
                break;

            case "blackout":
                triggerRemoteBlackout();
                break;

            case "flash":
            case "distortion":
                triggerRemoteDistortion();
                break;

        }

    }


    function clearRemoteVfx() {

        document.body.classList.remove(
            "remote-glitch",
            "remote-blackout",
            "remote-distortion"
        );

    }


    function triggerRemoteGlitch() {

        clearRemoteVfx();

        void document.body.offsetWidth;

        document.body.classList.add(
            "remote-glitch"
        );

        setTimeout(
            () => {

                document.body.classList.remove(
                    "remote-glitch"
                );

            },
            1300
        );

    }


    function triggerRemoteBlackout() {

        clearRemoteVfx();

        void document.body.offsetWidth;

        document.body.classList.add(
            "remote-blackout"
        );

        setTimeout(
            () => {

                document.body.classList.remove(
                    "remote-blackout"
                );

            },
            1800
        );

    }


    function triggerRemoteDistortion() {

        clearRemoteVfx();

        void document.body.offsetWidth;

        document.body.classList.add(
            "remote-distortion"
        );

        setTimeout(
            () => {

                document.body.classList.remove(
                    "remote-distortion"
                );

            },
            1050
        );

    }

</script>
