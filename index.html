<head>

    <title>Archive</title>

    <style>
        body {
            margin: 0;

            color: #ddd;

            justify-content: center;
            align-items: center;

        .archive {

        }

            border: none;
            border-top: 1px solid #444;
            margin: 25px 0;
        }

        .section {
            display: block;

            padding: 16px;
            margin: 10px 0;

            border: 1px solid #333;

            color: #aaa;
            text-decoration: none;

            transition: 0.15s;
        }

        .section:hover {
            border-color: #777;
            background: #1b1b1b;
            color: #fff;
        }

        .available {
            color: #ddd;
        }

        .locked {
            color: #555;
            cursor: default;
        }

        .footer {
            margin-top: 30px;
            color: #444;
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
</head>
