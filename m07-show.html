<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M07 — MTV TIME</title>
<style>
* { box-sizing:border-box; }
html,body {
  margin:0; width:100%; height:100%; overflow:hidden;
  background:#100b2d; font-family:"Courier New",monospace;
}
body { min-width:100vw; min-height:100vh; }

#show {
  position:relative; width:100vw; height:100vh; overflow:hidden;
  background:
    linear-gradient(180deg,#24125c 0%,#38217a 43%,#162b67 72%,#101638 100%);
  color:#fff8c8;
  image-rendering:pixelated;
}

/* ---------- MOVING BROADCAST BACKGROUND ---------- */
.bg-rays {
  position:absolute; inset:-35%;
  background:
    repeating-conic-gradient(
      from 0deg at 50% 48%,
      rgba(255,75,171,.13) 0deg 10deg,
      rgba(255,216,67,.07) 10deg 20deg,
      rgba(68,230,211,.11) 20deg 30deg,
      rgba(105,74,220,.04) 30deg 40deg
    );
  animation:raysTurn 22s linear infinite;
}
@keyframes raysTurn { to { transform:rotate(360deg); } }

.back-grid {
  position:absolute; left:0; right:0; bottom:0; height:34%;
  background:
    repeating-linear-gradient(90deg,transparent 0 8%,rgba(255,211,74,.13) 8% 8.35%),
    repeating-linear-gradient(0deg,transparent 0 20%,rgba(255,211,74,.11) 20% 21%),
    linear-gradient(180deg,#233578,#11183f);
  border-top:5px solid #62e7d2;
  transform:perspective(500px) rotateX(18deg);
  transform-origin:bottom center;
}
.back-grid:after {
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg,rgba(255,63,151,.15),transparent 30% 70%,rgba(85,231,211,.14));
}

.starfield { position:absolute; inset:0; pointer-events:none; }
.spark {
  position:absolute; width:9px; height:9px; background:#ffe253;
  transform:rotate(45deg); opacity:.75;
  animation:sparkle 1.8s steps(2,end) infinite;
}
.spark:nth-child(2n){ background:#61ead5; animation-delay:.45s; }
.spark:nth-child(3n){ background:#ff58aa; animation-delay:.9s; }
@keyframes sparkle {
  0%,49% { transform:rotate(45deg) scale(.55); opacity:.35; }
  50%,100% { transform:rotate(45deg) scale(1.25); opacity:1; }
}

/* ---------- CURTAINS ---------- */
.curtain {
  position:absolute; z-index:3; top:0; bottom:0; width:8.5%;
  background:
    repeating-linear-gradient(90deg,#8b176d 0 18%,#d62b8c 18% 39%,#ff4ca3 39% 55%,#bd217e 55% 78%,#74135f 78% 100%);
  box-shadow:inset -7px 0 #5d174f, inset 7px 0 rgba(255,255,255,.08);
  animation:curtainSway 3.8s steps(4,end) infinite;
}
.curtain.left { left:0; transform-origin:left top; }
.curtain.right { right:0; transform-origin:right top; animation-delay:.7s; }
@keyframes curtainSway {
  0%,100% { width:8.5%; }
  50% { width:9.3%; }
}

/* ---------- TOP LIGHT RIG ---------- */
.rig {
  position:absolute; z-index:8; left:8%; right:8%; top:0; height:7%;
  background:#141026; border-bottom:4px solid #31275c;
}
.rig:after {
  content:""; position:absolute; left:0; right:0; bottom:-8px; height:4px;
  background:repeating-linear-gradient(90deg,#ffe153 0 5%,#ff4ba6 5% 10%,#61e9d4 10% 15%);
}
.spot {
  position:absolute; top:65%; width:5.2%; height:62%; background:#171324;
  border:4px solid #090713; transform-origin:50% 0;
  animation:spotWobble 3.2s steps(5,end) infinite;
}
.spot:after {
  content:""; position:absolute; left:20%; right:20%; bottom:-12px; height:12px;
  background:#ffe45b; box-shadow:0 0 18px #ffe45b;
}
.spot:nth-child(2n):after { background:#ff4ca3; box-shadow:0 0 18px #ff4ca3; }
.spot:nth-child(3n):after { background:#62ead5; box-shadow:0 0 18px #62ead5; }
@keyframes spotWobble {
  0%,100% { transform:rotate(-5deg); }
  50% { transform:rotate(5deg); }
}

/* ---------- TITLE ---------- */
.title-wrap {
  position:absolute; z-index:10; left:50%; top:8.5%; transform:translateX(-50%);
  width:72%; text-align:center;
}
.kicker {
  display:inline-block; padding:.3vh 1.2vw;
  color:#ffe05a; background:#522278; border:3px solid #f44a9d;
  font-size:clamp(10px,1.25vw,20px); font-weight:bold; letter-spacing:.22em;
  box-shadow:5px 5px 0 #160b31;
}
.title {
  margin-top:.8vh;
  font-family:Impact,"Arial Black",sans-serif;
  font-size:clamp(30px,5vw,78px); line-height:.85; letter-spacing:.035em;
  color:#ff4c9f;
  text-shadow:4px 4px 0 #ffe052,8px 8px 0 #56206e,12px 12px 0 #130b31;
  transform:rotate(-1deg);
  animation:titleBounce 2.4s steps(4,end) infinite;
}
.title .mtv { color:#ffe052; text-shadow:4px 4px 0 #ff4c9f,8px 8px 0 #56206e,12px 12px 0 #130b31; }
@keyframes titleBounce {
  0%,100% { transform:translateY(0) rotate(-1deg); }
  50% { transform:translateY(-5px) rotate(1deg); }
}

/* ---------- CENTRAL GAME CARD ---------- */
.game-card {
  position:absolute; z-index:12; left:50%; top:25%;
  width:min(82vw,1180px); height:67%;
  transform:translateX(-50%);
  background:#21164d;
  border:6px solid #61e7d2;
  box-shadow:0 0 0 6px #ff4a9f,0 0 0 12px #ffd94d,12px 12px 0 rgba(0,0,0,.45);
}
.game-card:before {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(135deg,rgba(255,255,255,.055),transparent 30%),
    repeating-linear-gradient(0deg,transparent 0 5px,rgba(0,0,0,.055) 5px 7px);
}

/* ---------- FUN METER ---------- */
.meter-zone {
  position:absolute; left:3%; top:5%; bottom:5%; width:13%;
  text-align:center;
}
.meter-title {
  color:#ffe157; font-weight:900; font-size:clamp(11px,1.4vw,22px);
  letter-spacing:.08em; text-shadow:3px 3px #8b236f;
}
.meter-shell {
  position:absolute; left:27%; top:10%; width:46%; height:76%;
  background:#100c31; border:4px solid #ffe052;
  box-shadow:0 0 0 4px #e83e96,5px 5px 0 #0b071d;
  overflow:hidden;
}
.meter-fill {
  position:absolute; left:0; right:0; bottom:0; height:0%;
  background:
    repeating-linear-gradient(0deg,#ff4a9f 0 11px,#ff4a9f 11px 15px,#ffe052 15px 26px,#62e7d2 26px 36px);
  transition:height .24s steps(4,end);
}
.meter-shine {
  position:absolute; left:18%; top:0; width:18%; height:100%;
  background:rgba(255,255,255,.17);
}
.meter-count {
  position:absolute; left:0; right:0; bottom:0;
  color:#65ead7; font-weight:bold; font-size:clamp(10px,1.1vw,18px);
}
.meter-zone.bump { animation:meterBump .28s steps(2,end); }
@keyframes meterBump { 50% { transform:scale(1.07); } }

/* ---------- CODE SLOTS ---------- */
.input-zone {
  position:absolute; left:18%; right:3%; top:5%; height:25%;
}
.input-label {
  text-align:center; color:#ffe052; font-weight:bold;
  font-size:clamp(11px,1.35vw,21px); letter-spacing:.18em;
  margin-bottom:1.3vh;
}
.slots {
  width:100%; display:table; table-layout:fixed; border-spacing:.45vw 0;
}
.slot {
  display:table-cell; height:clamp(38px,6vh,66px); vertical-align:middle;
  text-align:center; background:#12103a; border:3px solid #5e66a9;
  color:#fff6c5; font-size:clamp(18px,2.2vw,35px); font-weight:bold;
  box-shadow:inset 0 -5px #090722;
}
.slot.active {
  border-color:#ffe052; background:#3d2879;
  box-shadow:inset 0 -5px #1b1248,0 0 0 3px #ff4a9f,0 0 16px #ffe052;
  animation:slotPulse .65s steps(2,end) infinite;
}
.slot.correct { color:#fff16b; border-color:#65ead7; background:#294d69; }
.slot.wrong { animation:wrong .25s steps(2,end) 2; }
@keyframes slotPulse { 50% { background:#55318b; } }
@keyframes wrong { 50%,100% { background:#a21e5e; border-color:#ff7ebc; } }

/* ---------- BUILT-IN TV KEYBOARD ---------- */
.keyboard-wrap {
  position:absolute; left:18%; right:3%; top:35%; bottom:6%;
}
.keyboard-title {
  height:10%; color:#67e9d5; font-weight:bold; text-align:center;
  font-size:clamp(9px,1vw,16px); letter-spacing:.12em;
}
.keyboard {
  position:absolute; left:0; right:0; top:12%; bottom:0;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(6,1fr);
  gap:clamp(3px,.55vw,9px);
}
.key {
  position:relative; display:flex; align-items:center; justify-content:center;
  background:#33216c; border:3px solid #7255aa; color:#fff7c9;
  font-weight:900; font-size:clamp(14px,1.55vw,26px);
  box-shadow:inset 0 -5px #1a1048,4px 4px 0 rgba(0,0,0,.28);
}
.key:nth-child(6n+1),.key:nth-child(6n+4) { border-color:#db4697; }
.key:nth-child(6n+2),.key:nth-child(6n+5) { border-color:#58cdbf; }
.key:nth-child(6n+3),.key:nth-child(6n+6) { border-color:#d5b847; }
.key.selected {
  z-index:3; background:#ffe052; color:#271346; border-color:#fff6b5;
  box-shadow:0 0 0 4px #ff4b9f,0 0 20px #ffe052,5px 5px 0 #6b205e;
  transform:translate(-2px,-2px);
}
.key.flash { animation:keyHit .22s steps(2,end); }
@keyframes keyHit { 50% { transform:translate(2px,2px); background:#65ead7; } }

.remote-help {
  position:absolute; z-index:15; right:2.5%; bottom:1.2%;
  color:#aeb3e5; font-size:clamp(8px,.8vw,13px); letter-spacing:.05em;
}
.remote-help b { color:#ffe052; }

/* ---------- CRT ---------- */
.scanlines,.vignette { position:absolute; z-index:80; inset:0; pointer-events:none; }
.scanlines {
  opacity:.11;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 4px);
}
.vignette { box-shadow:inset 0 0 8vw rgba(6,2,28,.55); }
.broadcast-flicker {
  position:absolute; z-index:79; inset:0; pointer-events:none; opacity:0;
  background:#fff; animation:flicker 7s steps(2,end) infinite;
}
@keyframes flicker { 0%,96%,100%{opacity:0} 97%{opacity:.035} 98%{opacity:0} 99%{opacity:.02} }

/* ---------- SUCCESS ---------- */
.meter-launch {
  position:absolute; z-index:120; left:9.4%; bottom:10%; width:5%; height:0; opacity:0;
  background:repeating-linear-gradient(90deg,#ff4a9f 0 25%,#ffe052 25% 50%,#62ead5 50% 75%,#fff 75% 100%);
}
.meter-launch.go { opacity:1; height:115%; transition:height .7s steps(10,end); }
.game-card.overload { animation:cardShake .1s steps(2,end) 8; }
@keyframes cardShake { 0%{margin-left:-4px} 100%{margin-left:4px} }

.whiteout {
  position:absolute; z-index:150; inset:0; background:#fff; opacity:0; pointer-events:none;
}
.whiteout.go { animation:whiteout 1.15s steps(10,end) forwards; }
@keyframes whiteout { 0%{opacity:0} 45%{opacity:.2} 75%{opacity:.75} 100%{opacity:1} }

.final-screen {
  display:none; position:absolute; z-index:220; inset:0; background:#12092b;
}
.final-screen.show { display:block; }
.final-card {
  position:absolute; left:12%; right:12%; top:23%; bottom:23%;
  background:#25144f; border:8px solid #ff4a9f;
  box-shadow:0 0 0 7px #ffe052,0 0 0 14px #62e7d2,12px 12px 0 #09051a;
}
.final-inner {
  position:absolute; inset:8%; border:5px solid #ffe052; background:#171038;
  display:flex; align-items:center; justify-content:center; padding:4%;
}
.final-text {
  text-align:center; color:#fff1a2; font-weight:900;
  font-size:clamp(22px,4vw,66px); line-height:1.05;
  text-shadow:4px 4px #c32675,8px 8px #0b071d;
}
.bulb { position:absolute; width:12px; height:12px; background:#ffe052; box-shadow:0 0 8px #ffe052; }
.bulb.alt { background:#62ead5; box-shadow:0 0 8px #62ead5; }
.bulb.pink { background:#ff4a9f; box-shadow:0 0 8px #ff4a9f; }

/* small / unusual TV aspect ratios */
@media (max-height:620px) {
  .title-wrap { top:7%; }
  .game-card { top:24%; height:69%; }
  .input-label { margin-bottom:.5vh; }
  .keyboard-title { height:8%; }
  .keyboard { top:10%; }
}
</style>
</head>
<body>
<div id="show">
  <div class="bg-rays"></div>
  <div class="back-grid"></div>

  <div class="starfield">
    <i class="spark" style="left:13%;top:19%"></i>
    <i class="spark" style="left:20%;top:55%"></i>
    <i class="spark" style="left:84%;top:20%"></i>
    <i class="spark" style="left:77%;top:51%"></i>
    <i class="spark" style="left:11%;top:75%"></i>
    <i class="spark" style="left:90%;top:70%"></i>
    <i class="spark" style="left:31%;top:16%"></i>
    <i class="spark" style="left:68%;top:14%"></i>
  </div>

  <div class="curtain left"></div>
  <div class="curtain right"></div>

  <div class="rig">
    <div class="spot" style="left:7%"></div>
    <div class="spot" style="left:24%;animation-delay:.4s"></div>
    <div class="spot" style="left:46%;animation-delay:.8s"></div>
    <div class="spot" style="left:68%;animation-delay:1.2s"></div>
    <div class="spot" style="left:88%;animation-delay:1.6s"></div>
  </div>

  <div class="title-wrap">
    <div class="kicker">MERIDIAN PRESENTS</div>
    <div class="title">IT'S <span class="mtv">M.T.V.</span> TIME!!!</div>
  </div>

  <div class="game-card" id="gameCard">
    <div class="meter-zone" id="meterZone">
      <div class="meter-title">FUN<br>METER</div>
      <div class="meter-shell">
        <div class="meter-fill" id="meterFill"><div class="meter-shine"></div></div>
        <div class="meter-launch" id="meterLaunch"></div>
      </div>
      <div class="meter-count" id="meterCount">0 / 12</div>
    </div>

    <div class="input-zone">
      <div class="input-label">ENTER THE CODE</div>
      <div class="slots" id="slots">
        <div class="slot active">?</div><div class="slot">?</div><div class="slot">?</div>
        <div class="slot">?</div><div class="slot">?</div><div class="slot">?</div>
        <div class="slot">?</div><div class="slot">?</div><div class="slot">?</div>
        <div class="slot">?</div><div class="slot">?</div><div class="slot">?</div>
      </div>
    </div>

    <div class="keyboard-wrap">
      <div class="keyboard-title">SELECT WITH CLICK &nbsp;•&nbsp; SELECT CORRECTLY</div>
      <div class="keyboard" id="keyboard"></div>
    </div>
  </div>

  <div class="remote-help"><b>↑↓←→</b> MOVE &nbsp; <b>OK</b> SELECT</div>

  <div class="whiteout" id="whiteout"></div>

  <div class="final-screen" id="finalScreen">
    <div class="final-card" id="finalCard">
      <div class="final-inner"><div class="final-text" id="finalText"></div></div>
    </div>
  </div>

  <div class="broadcast-flicker"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>
</div>

<script>
(function () {
  /* ============================================================
     EDIT THESE FOR THE FINAL VERSION
     ============================================================ */
  var CORRECT_CODE = "KROASLNIDGEM"; /* exactly 12 characters */
  var FINAL_MESSAGE = "CONGRATULATIONS!!!!<br>YOU'VE SOLVED IT ALL!!!<br><br>32°03'03.2&quot;S 115°51'49.9&quot;E";

  var CHARACTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  var values = ["","","","","","","","","","","",""];
  var activeSlot = 0;
  var keyboardIndex = 0;
  var focusArea = "slots"; /* "slots" or "keyboard" */
  var finished = false;

  var slots = document.getElementsByClassName("slot");
  var keyboard = document.getElementById("keyboard");
  var meterFill = document.getElementById("meterFill");
  var meterCount = document.getElementById("meterCount");
  var meterZone = document.getElementById("meterZone");
  var gameCard = document.getElementById("gameCard");
  var launch = document.getElementById("meterLaunch");
  var whiteout = document.getElementById("whiteout");
  var finalScreen = document.getElementById("finalScreen");
  var finalCard = document.getElementById("finalCard");
  var finalText = document.getElementById("finalText");

  CORRECT_CODE = CORRECT_CODE.toUpperCase();

  function buildKeyboard() {
    var i;
    for (i = 0; i < CHARACTERS.length; i++) {
      var key = document.createElement("div");
      key.className = "key";
      key.innerHTML = CHARACTERS.charAt(i);
      key.setAttribute("data-index", i);
      key.onclick = (function(index) {
        return function() {
          focusArea = "keyboard";
          keyboardIndex = index;
          drawFocus();
          chooseKey();
        };
      })(i);
      keyboard.appendChild(key);
    }
  }

  function buildFinalBulbs() {
    var i, bulb;
    for (i = 0; i < 18; i++) {
      bulb = document.createElement("i");
      bulb.className = "bulb " + (i % 3 === 1 ? "alt" : (i % 3 === 2 ? "pink" : ""));
      bulb.style.left = (3 + (i * 94 / 17)) + "%";
      bulb.style.top = "-7px";
      finalCard.appendChild(bulb);

      bulb = document.createElement("i");
      bulb.className = "bulb " + (i % 3 === 0 ? "alt" : (i % 3 === 1 ? "pink" : ""));
      bulb.style.left = (3 + (i * 94 / 17)) + "%";
      bulb.style.bottom = "-7px";
      finalCard.appendChild(bulb);
    }
    for (i = 1; i < 8; i++) {
      bulb = document.createElement("i");
      bulb.className = "bulb " + (i % 3 === 1 ? "alt" : (i % 3 === 2 ? "pink" : ""));
      bulb.style.left = "-7px";
      bulb.style.top = (i * 12.5) + "%";
      finalCard.appendChild(bulb);

      bulb = document.createElement("i");
      bulb.className = "bulb " + (i % 3 === 0 ? "alt" : (i % 3 === 1 ? "pink" : ""));
      bulb.style.right = "-7px";
      bulb.style.top = (i * 12.5) + "%";
      finalCard.appendChild(bulb);
    }
  }

  function drawFocus() {
    var i;
    var keys = document.getElementsByClassName("key");

    for (i = 0; i < slots.length; i++) {
      slots[i].className = slots[i].className.replace(" active", "");
      if (focusArea === "slots" && i === activeSlot) {
        slots[i].className += " active";
      }
    }

    for (i = 0; i < keys.length; i++) {
      keys[i].className = keys[i].className.replace(" selected", "");
      if (focusArea === "keyboard" && i === keyboardIndex) {
        keys[i].className += " selected";
      }
    }
  }

  function countCorrect() {
    var total = 0;
    var i;
    for (i = 0; i < 12; i++) {
      if (values[i] !== "" && values[i] === CORRECT_CODE.charAt(i)) {
        total++;
      }
    }
    return total;
  }

  function drawSlot(index) {
    var base = "slot";
    slots[index].innerHTML = values[index] || "?";

    if (values[index] !== "" && values[index] === CORRECT_CODE.charAt(index)) {
      base += " correct";
    }
    slots[index].className = base;

    if (focusArea === "slots" && index === activeSlot) {
      slots[index].className += " active";
    }
  }

  function updateMeter() {
    var correct = countCorrect();
    meterFill.style.height = ((correct / 12) * 100) + "%";
    meterCount.innerHTML = correct + " / 12";

    meterZone.className = "meter-zone";
    window.setTimeout(function() {
      if (!finished) meterZone.className = "meter-zone bump";
    }, 20);

    if (correct === 12) {
      finish();
    }
  }

  function enterCharacter(character) {
    if (finished) return;

    values[activeSlot] = character;
    drawSlot(activeSlot);

    if (character !== CORRECT_CODE.charAt(activeSlot)) {
      slots[activeSlot].className += " wrong";
      (function(index) {
        window.setTimeout(function() {
          drawSlot(index);
          drawFocus();
        }, 420);
      })(activeSlot);
    }

    updateMeter();

    if (!finished && activeSlot < 11) {
      activeSlot++;
    }

    /* Stay on the on-screen keyboard so the TV remote can keep typing. */
    focusArea = "keyboard";
    drawFocus();
  }

  function chooseKey() {
    if (finished) return;
    var keys = document.getElementsByClassName("key");
    var chosen = CHARACTERS.charAt(keyboardIndex);

    keys[keyboardIndex].className += " flash";
    window.setTimeout(function() {
      drawFocus();
    }, 230);

    enterCharacter(chosen);
  }

  function moveKeyboard(dx, dy) {
    var col = keyboardIndex % 6;
    var row = Math.floor(keyboardIndex / 6);

    col += dx;
    row += dy;

    if (col < 0) col = 5;
    if (col > 5) col = 0;

    if (row < 0) {
      focusArea = "slots";
      drawFocus();
      return;
    }
    if (row > 5) row = 0;

    keyboardIndex = (row * 6) + col;
    drawFocus();
  }

  function finish() {
    if (finished) return;
    finished = true;

    gameCard.className += " overload";

    window.setTimeout(function() {
      launch.className += " go";
    }, 180);

    window.setTimeout(function() {
      whiteout.className += " go";
    }, 430);

    window.setTimeout(function() {
      finalText.innerHTML = FINAL_MESSAGE;
      finalScreen.className += " show";
    }, 1650);
  }

  document.onkeydown = function(event) {
    if (finished) return;

    event = event || window.event;
    var key = event.keyCode || event.which;

    /* LEFT */
    if (key === 37) {
      if (focusArea === "slots") {
        activeSlot--;
        if (activeSlot < 0) activeSlot = 11;
        drawFocus();
      } else {
        moveKeyboard(-1,0);
      }
      return false;
    }

    /* RIGHT */
    if (key === 39) {
      if (focusArea === "slots") {
        activeSlot++;
        if (activeSlot > 11) activeSlot = 0;
        drawFocus();
      } else {
        moveKeyboard(1,0);
      }
      return false;
    }

    /* UP */
    if (key === 38) {
      if (focusArea === "keyboard") {
        moveKeyboard(0,-1);
      }
      return false;
    }

    /* DOWN */
    if (key === 40) {
      if (focusArea === "slots") {
        focusArea = "keyboard";
        /* Start near the selected slot's horizontal position. */
        keyboardIndex = Math.min(5, Math.floor(activeSlot / 2));
        drawFocus();
      } else {
        moveKeyboard(0,1);
      }
      return false;
    }

    /* ENTER / TV REMOTE OK */
    if (key === 13) {
      if (focusArea === "slots") {
        focusArea = "keyboard";
        keyboardIndex = Math.min(5, Math.floor(activeSlot / 2));
        drawFocus();
      } else {
        chooseKey();
      }
      return false;
    }

    /* BACKSPACE */
    if (key === 8) {
      values[activeSlot] = "";
      drawSlot(activeSlot);
      updateMeter();
      drawFocus();
      return false;
    }

    /* Desktop keyboard testing still works. */
    if ((key >= 48 && key <= 57) || (key >= 65 && key <= 90)) {
      enterCharacter(String.fromCharCode(key));
      return false;
    }
  };

  /* Mouse/touch support for desktop testing. */
  for (var s = 0; s < slots.length; s++) {
    slots[s].onclick = (function(index) {
      return function() {
        if (finished) return;
        activeSlot = index;
        focusArea = "slots";
        drawFocus();
      };
    })(s);
  }

  buildKeyboard();
  buildFinalBulbs();
  drawFocus();
  updateMeter();
})();
</script>
</body>
</html>
