<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — M07</title>

<style>

/* ================================================================
   GLOBAL
================================================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #111;
}

body {
    min-height: 100vh;
    overflow: hidden;

    color: #ddd;

    font-family:
        "Courier New",
        Courier,
        monospace;
}


/* ================================================================
   SCREENS
================================================================ */

.screen {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 30px;
}

.screen.active {
    display: flex;
}


/* ================================================================
   MERIDIAN LANDING
================================================================ */

.archive {
    position: relative;
    z-index: 10;

    width: 90%;
    max-width: 700px;

    text-align: center;
}

h1 {
    margin: 0;

    color: #ddd;

    font-size: 42px;
    font-weight: normal;

    letter-spacing: 8px;
}

.subtitle {
    margin-top: 8px;
    margin-bottom: 35px;

    color: #777;

    font-size: 14px;
    letter-spacing: 3px;
}

hr {
    margin: 25px 0;

    border: none;
    border-top: 1px solid #444;
}

.section {
    display: block;

    width: 100%;

    margin: 10px 0;
    padding: 16px;

    border: 1px solid #333;

    background: rgba(17,17,17,0.65);

    color: #ddd;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size: 16px;

    cursor: pointer;
    outline: none;
}

.section:hover,
.section:focus,
.section.selected {
    border-color: #777;

    background: #1b1b1b;

    color: #fff;
}

.footer {
    margin-top: 30px;

    color: #444;

    font-size: 12px;
    letter-spacing: 2px;
}


/* ================================================================
   LOADING SCREEN
================================================================ */

.loading-screen {
    background: #111;

    text-align: center;
}

.loader {
    position: relative;
    z-index: 10;

    width: 520px;
    max-width: 74vw;

    text-align: center;
}

.loading-title {
    position: relative;

    margin-bottom: 22px;

    color: #aaa;

    font-size: 14px;
    font-weight: normal;

    letter-spacing: 3px;
}

.loading-bar-area {
    position: relative;

    width: 100%;

    margin-left: auto;
    margin-right: auto;
}

.loading-bar-shell {
    position: relative;

    width: 100%;
    height: 18px;

    padding: 3px;

    overflow: hidden;

    border: 1px solid #555;

    background: #111;
}

.loading-bar {
    position: relative;

    width: 0%;
    height: 100%;

    background: #bbb;
}

.loading-percentage {
    position: relative;

    margin-top: 16px;

    color: #777;

    font-size: 13px;
    letter-spacing: 2px;
}


/* ================================================================
   ERROR
================================================================ */

.interception {
    margin-top: 30px;

    opacity: 0;
    visibility: hidden;
}

.interception.visible {
    opacity: 1;
    visibility: visible;
}

.interception.urgent {
    animation:
        urgentError
        0.62s
        steps(2, end)
        infinite;
}

.error-title {
    color: #e25858;

    font-size: 16px;
    font-weight: bold;

    letter-spacing: 5px;
}

.error-message {
    margin-top: 9px;

    color: #c27a7a;

    font-size: 12px;
    letter-spacing: 2px;
}

@keyframes urgentError {

    0%, 35% {
        opacity: 1;
    }

    36%, 52% {
        opacity: 0.12;
    }

    53%, 78% {
        opacity: 1;
    }

    79%, 88% {
        opacity: 0.3;
    }

    89%, 100% {
        opacity: 1;
    }
}


/* ================================================================
   EXIT
================================================================ */

.exit-button {
    display: none;

    width: 150px;

    margin: 24px auto 0;
    padding: 10px 15px;

    border: 1px solid #843f3f;

    background: transparent;

    color: #c56c6c;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size: 13px;
    letter-spacing: 3px;

    cursor: pointer;
    outline: none;
}

.exit-button.visible {
    display: block;
}

.exit-button:hover,
.exit-button:focus {
    border-color: #c56c6c;

    background: #281616;

    color: #eee;
}

.exit-button.pressed {
    background: #381818;

    transform: translateY(1px);
}


/* ================================================================
   ERROR FLASH
================================================================ */

.error-flash {
    position: fixed;

    top: 0;
    right: 0;
    bottom: 0;
    left: 0;

    z-index: 110;

    pointer-events: none;

    background: rgba(190,15,15,0.13);

    opacity: 0;
}

.error-flash.active {
    animation:
        errorFlash
        0.48s
        steps(2, end);
}

@keyframes errorFlash {

    0% {
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    22% {
        opacity: 0;
    }

    39% {
        opacity: 0.8;
    }

    50% {
        opacity: 0;
    }

    68% {
        opacity: 0.5;
    }

    78%,
    100% {
        opacity: 0;
    }
}


/* ================================================================
   CORRUPTION SHARED
================================================================ */

.loader.corrupting {
    width: 660px;
    max-width: 86vw;
}

.loader.corrupting .loading-bar-area {
    transition:
        width 0.05s linear,
        transform 0.05s linear;
}

/* ================================================================
   TENNA MARQUEE

   Built independently from the generic bar.
================================================================ */

.tenna-loader {
    display: none;

    position: relative;

    width: 720px;
    max-width: 84vw;

    margin: 0 auto;

    image-rendering: pixelated;
}

.style-tenna .normal-loader-content {
    display: none;
}

.style-tenna .tenna-loader {
    display: block;
}


/* ================================================================
   TENNA PIXEL TEXT

   Text itself is rendered by JS as 5x7 pixel glyphs.
   This avoids relying on fonts installed on the TV.
================================================================ */

.pixel-text {
    display: flex;

    align-items: center;
    justify-content: center;

    flex-wrap: nowrap;
}

.pixel-letter {
    position: relative;

    display: inline-block;

    flex: 0 0 auto;
}

.pixel-cell {
    position: absolute;

    display: block;
}

.tenna-title {
    height: 35px;

    margin-bottom: 22px;

    color: #ff3038;
}

.tenna-title .pixel-letter {
    width: 20px;
    height: 28px;

    margin-right: 4px;
}

.tenna-title .pixel-cell {
    width: 4px;
    height: 4px;

    background: #ff3038;

    box-shadow:
        2px 2px 0 #72080d;
}


.tenna-percent {
    height: 40px;

    margin-top: 25px;

    color: #ffd629;
}

.tenna-percent .pixel-letter {
    width: 25px;
    height: 35px;

    margin-right: 4px;
}

.tenna-percent .pixel-cell {
    width: 5px;
    height: 5px;

    background: #ffd629;

    box-shadow:
        2px 2px 0 #76100e;
}


/* ================================================================
   TENNA FRAME
================================================================ */

.tenna-frame {
    position: relative;

    width: 100%;
    height: 82px;

    padding: 17px 20px;

    background: #171717;

    border: 8px solid #f1252d;

    box-shadow:
        0 6px 0 #861015,
        6px 0 0 #861015,
        -6px 0 0 #861015,
        0 -3px 0 #ff4348;

    image-rendering: pixelated;
}

.tenna-track {
    position: relative;

    width: 100%;
    height: 100%;

    /*
     * IMPORTANT:
     *
     * Overflow must become visible so the gold bar can
     * physically escape the loading frame.
     */

    overflow: visible;

    background: #111;

    border: 4px solid #390506;
}

.tenna-fill {
    position: relative;

    width: 30%;
    height: 100%;

    background:
        linear-gradient(
            to bottom,
            #fff77c 0%,
            #fff77c 16%,
            #ffe52f 17%,
            #ffc315 52%,
            #d87b00 82%,
            #ffb20c 100%
        );

    box-shadow:
        inset 0 6px 0 #fffca5,
        inset 0 -7px 0 #9e5100,
        0 0 12px #ffd11c;

    image-rendering: pixelated;
}

.tenna-fill:after {
    content: "";

    position: absolute;

    top: 5px;
    left: 7px;

    width: 72%;
    height: 5px;

    background: #ffffb1;
}


/* ================================================================
   OVERLOAD MODE
================================================================ */

.tenna-fill.overloading {
    z-index: 20;

    animation:
        overloadFill
        0.11s
        steps(2,end)
        infinite;
}

.tenna-frame.overloading {
    animation:
        overloadFrame
        0.14s
        steps(2,end)
        infinite;
}

.tenna-percent.overloading .pixel-cell {
    animation:
        overloadText
        0.1s
        steps(2,end)
        infinite;
}

@keyframes overloadFill {

    0% {
        filter:
            brightness(1.15);

        box-shadow:
            inset 0 6px 0 #fffca5,
            inset 0 -7px 0 #9e5100,
            0 0 12px #ffd11c;
    }

    50% {
        filter:
            brightness(2.2);

        box-shadow:
            inset 0 6px 0 white,
            inset 0 -7px 0 #ff9900,
            0 0 18px #fff46a,
            0 0 35px #ffd000,
            0 0 70px #ff9d00;
    }

    100% {
        filter:
            brightness(1.15);

        box-shadow:
            inset 0 6px 0 #fffca5,
            inset 0 -7px 0 #9e5100,
            0 0 12px #ffd11c;
    }
}

@keyframes overloadFrame {

    0% {
        transform:
            translate(0,0);
    }

    25% {
        transform:
            translate(-2px,1px);
    }

    50% {
        transform:
            translate(2px,-1px);
    }

    75% {
        transform:
            translate(-1px,-1px);
    }

    100% {
        transform:
            translate(0,0);
    }
}

@keyframes overloadText {

    0% {
        background: #ffd629;

        box-shadow:
            2px 2px 0 #76100e;
    }

    50% {
        background: #fff8a0;

        box-shadow:
            2px 2px 0 #b42913,
            0 0 8px #ffe228;
    }

    100% {
        background: #ffd629;

        box-shadow:
            2px 2px 0 #76100e;
    }
}


/* ================================================================
   TENNA BULBS
================================================================ */

.bulb-rail {
    position: absolute;

    pointer-events: none;
}

.bulb-top,
.bulb-bottom {
    left: 18px;
    right: 18px;

    height: 10px;
}

.bulb-top {
    top: -19px;
}

.bulb-bottom {
    bottom: -19px;
}

.bulb-left,
.bulb-right {
    top: 10px;
    bottom: 10px;

    width: 10px;
}

.bulb-left {
    left: -19px;
}

.bulb-right {
    right: -19px;
}

.bulb {
    position: absolute;

    width: 7px;
    height: 7px;

    background: #ffe72c;

    border-radius: 50%;

    box-shadow:
        0 0 4px #ffe72c;
}


/* horizontal */

.bulb-horizontal .bulb:nth-child(1)  { left: 0%; }
.bulb-horizontal .bulb:nth-child(2)  { left: 8%; }
.bulb-horizontal .bulb:nth-child(3)  { left: 16%; }
.bulb-horizontal .bulb:nth-child(4)  { left: 24%; }
.bulb-horizontal .bulb:nth-child(5)  { left: 32%; }
.bulb-horizontal .bulb:nth-child(6)  { left: 40%; }
.bulb-horizontal .bulb:nth-child(7)  { left: 48%; }
.bulb-horizontal .bulb:nth-child(8)  { left: 56%; }
.bulb-horizontal .bulb:nth-child(9)  { left: 64%; }
.bulb-horizontal .bulb:nth-child(10) { left: 72%; }
.bulb-horizontal .bulb:nth-child(11) { left: 80%; }
.bulb-horizontal .bulb:nth-child(12) { left: 88%; }
.bulb-horizontal .bulb:nth-child(13) { left: 98%; }


/* vertical */

.bulb-vertical .bulb:nth-child(1) {
    top: 0%;
}

.bulb-vertical .bulb:nth-child(2) {
    top: 31%;
}

.bulb-vertical .bulb:nth-child(3) {
    top: 62%;
}

.bulb-vertical .bulb:nth-child(4) {
    top: 94%;
}


.bulb:nth-child(odd) {
    animation:
        bulbOdd
        0.36s

/* ================================================================

================================================================ */

function renderPixelText(
    element,
    text
) {

    element.innerHTML =
        "";


    var i;
    var row;
    var col;


    for (
        i = 0;
        i < text.length;
        i++
    ) {

        var character =
            text.charAt(i).toUpperCase();


        var glyph =
            pixelFont[character];


        if (!glyph) {
            glyph = pixelFont[" "];
        }


        var letter =
            document.createElement(
                "span"
            );


        letter.className =
            "pixel-letter";


        for (
            row = 0;
            row < 7;
            row++
        ) {

            for (
                col = 0;
                col < 5;
                col++
            ) {

                if (
                    glyph[row].charAt(col)
                    ===
                    "1"
                ) {

                    var cell =
                        document.createElement(
                            "span"
                        );


                    cell.className =
                        "pixel-cell";


                    cell.style.left =
                        (col * 20) + "%";


                    cell.style.top =
                        (row * 14.2857) + "%";


                    letter.appendChild(
                        cell
                    );
                }
            }
        }


        element.appendChild(
            letter
        );
    }
}

}

/* ================================================================
   CORRUPTION
================================================================ */

function beginCorruption() {

    if (corruptionStarted) {
        return;
    }


    corruptionStarted =
        true;


    exitButton.style.display =
        "none";


    interception.style.display =
        "none";


    cycleCorruptionStyle(
        0
    );
}


function cycleCorruptionStyle(index) {

    if (
        index >=
        corruptionStyles.length
    ) {

        showTennaStyle();

        return;
    }


    showStyle(
        corruptionStyles[index],
        corruptionWidths[index]
    );


    var delay;


    if (index < 4) {
        delay = 520;
    }

    else if (index < 9) {
        delay = 390;
    }

    else if (index < 15) {
        delay = 300;
    }

    else if (index < 22) {
        delay = 240;
    }

    else if (index < 30) {
        delay = 200;
    }

    else {
        delay = 170;
    }


    window.setTimeout(
        function () {

            cycleCorruptionStyle(
                index + 1
            );

        },
        delay
    );
}


function showStyle(
    styleName,
    width
) {

    loader.className =
        "loader corrupting " +
        styleName;


    loadingBarArea.style.width =
        width + "%";


    loadingPercentage.innerHTML =
        "30%";


    loadingBar.style.width =
        "30%";
}


/* ================================================================
   TENNA ARRIVES
================================================================ */

function showTennaStyle() {

    loader.className =
        "loader corrupting style-tenna";


    tennaFill.style.width =
        "30%";


    renderPixelText(
        tennaPercentage,
        "30%"
    );


    /*
     * Let the player register the new stable visual identity.
     */

    window.setTimeout(
        function () {

            continueTennaLoading(
                30
            );

        },
        1000
    );
}


/* ================================================================
   30 -> 100

   Three distinct acceleration bands.
================================================================ */

function continueTennaLoading(
    progress
) {

    if (progress >= 100) {

        tennaFill.style.width =
            "100%";


        renderPixelText(
            tennaPercentage,
            "100%"
        );


        /*
         * Very important pause.
         *
         * It appears to have successfully completed.
         */

        window.setTimeout(
            function () {

                beginOverload();

            },
            1250
        );


        return;
    }


    progress +=
        1;


    tennaFill.style.width =
        progress + "%";


    renderPixelText(
        tennaPercentage,
        progress + "%"
    );


    var delay;


    /*
     * 30 -> 50
     *
     * Reasonable loading speed.
     */

    if (progress < 50) {

        delay =
            330 +
            Math.floor(
                Math.random() * 170
            );
    }


    /*
     * 50 -> 80
     *
     * Clearly accelerating.
     */

    else if (progress < 80) {

        delay =
            95 +
            Math.floor(
                Math.random() * 85
            );
    }


    /*
     * 80 -> 100
     *
     * Now it is running away.
     */

    else {

        delay =
            35 +
            Math.floor(
                Math.random() * 45
            );
    }


    window.setTimeout(
        function () {

            continueTennaLoading(
                progress
            );

        },
        delay
    );
}


/* ================================================================
   OVERLOAD

   The progress bar stops behaving like a percentage.
================================================================ */

var overloadValues = [

    104,
    111,
    123,
    141,
    168,
    207,
    281,
    394,
    604,
    921,

    1430,
    2388,
    4822,
    8174,
    18901,
    36117,
    94120,
    184992,

    611492,
    1482117,
    8104882,
    27199104,
    104882991,
    682144207,

    2194882104,
    10000000000

];


function beginOverload() {

    tennaFill.className =
        "tenna-fill overloading";


    tennaFrame.className =
        "tenna-frame overloading";


    tennaPercentage.className =
        "tenna-percent pixel-text overloading";


    runOverload(
        0
    );
}


function runOverload(index) {

    if (
        index >=
        overloadValues.length
    ) {

        /*
         * Hold the completely absurd state for a fraction
         * of a second before killing everything.
         */

        window.setTimeout(
            blackout,
            380
        );


        return;
    }


    var value =
        overloadValues[index];


    /*
     * The width is intentionally NOT capped at 100.
     *
     * It escapes the frame.
     *
     * We don't use the actual numerical percentage as CSS width
     * because a 10-billion-percent DOM element is unnecessary.
     *
     * Instead it accelerates visually to 420% of the track.
     */

    var visualWidth;


    if (index < 4) {

        visualWidth =
            100 +
            (index * 12);
    }

    else if (index < 9) {

        visualWidth =
            150 +
            ((index - 4) * 25);
    }

    else if (index < 15) {

        visualWidth =
            275 +
            ((index - 9) * 22);
    }

    else {

        visualWidth =
            407 +
            ((index - 15) * 7);
    }


    if (visualWidth > 470) {
        visualWidth = 470;
    }


    tennaFill.style.width =
        visualWidth + "%";


    renderPixelText(
        tennaPercentage,
        formatNumber(value) + "%"
    );


    /*
     * Numbers themselves accelerate too.
     */

    var delay;


    if (index < 5) {

        delay = 115;
    }

    else if (index < 12) {

        delay = 80;
    }

    else if (index < 19) {

        delay = 55;
    }

    else {

        delay = 38;
    }


    window.setTimeout(
        function () {

            runOverload(
                index + 1
            );

        },
        delay
    );
}


/* ================================================================
   NUMBER FORMAT

   Manual implementation rather than relying on locale formatting
   in an old browser.
================================================================ */

function formatNumber(number) {

    var string =
        String(number);


    var result =
        "";


    var count =
        0;


    var i;


    for (
        i = string.length - 1;
        i >= 0;
        i--
    ) {

        result =
            string.charAt(i) +
            result;


        count +=
            1;


        if (
            count === 3 &&
            i !== 0
        ) {

            result =
                "," +
                result;


            count =
                0;
        }
    }


    return result;
}

================================================================ */

function blackout() {

    broadcastBlackout.className =
        "broadcast-blackout active";


    /*
     * Proper dead-black pause.
     *

/* ================================================================

================================================================ */

function buildTVBulbs() {
    if (tvBulbs.innerHTML !== "") { return; }
    var i, bulb, count = 18;
    for (i = 0; i < count; i++) {
        bulb = document.createElement("span"); bulb.className = "tv-bulb " + (i % 2 ? "bright" : "dim");
        bulb.style.left = ((i / (count - 1)) * 100) + "%"; bulb.style.top = "0"; tvBulbs.appendChild(bulb);
        bulb = document.createElement("span"); bulb.className = "tv-bulb " + (i % 2 ? "dim" : "bright");
        bulb.style.left = ((i / (count - 1)) * 100) + "%"; bulb.style.bottom = "0"; tvBulbs.appendChild(bulb);
    }
    for (i = 1; i < 8; i++) {
        bulb = document.createElement("span"); bulb.className = "tv-bulb " + (i % 2 ? "bright" : "dim");
        bulb.style.left = "0"; bulb.style.top = ((i / 8) * 100) + "%"; tvBulbs.appendChild(bulb);
        bulb = document.createElement("span"); bulb.className = "tv-bulb " + (i % 2 ? "dim" : "bright");
        bulb.style.right = "0"; bulb.style.top = ((i / 8) * 100) + "%"; tvBulbs.appendChild(bulb);
    }
}

/* ================================================================
   SMART-TV ACCESS GATE

   The landing page itself is intentionally available everywhere.
   M07 only begins after the user selects it from a recognised TV
   browser. Smart-TV user-agent detection is heuristic, so the list
   is deliberately broad and easy to extend after testing the final
   television.
================================================================ */

function isSmartTVBrowser() {

    var userAgent =
        navigator.userAgent
        ?
        navigator.userAgent.toLowerCase()
        :
        "";

    var tvIdentifiers = [
        "smart-tv",
        "smarttv",
        "tizen",
        "webos",
        "web0s",
        "netcast",
        "android tv",
        "googletv",
        "google tv",
        "crkey",
        "aftb",
        "aftm",
        "aftt",
        "afts",
        "aftmm",
        "aftka",
        "aftkm",
        "aftss",
        "roku",
        "hbbtv",
        "viera",
        "bravia",
        "tv safari",
        "inettvbrowser",
        "dtv"
    ];

    var i;

    for (i = 0; i < tvIdentifiers.length; i++) {

        if (
            userAgent.indexOf(
                tvIdentifiers[i]
            ) !== -1
        ) {
            return true;
        }
    }

    return false;
}


function denyM07Access() {

    m07Button.innerHTML =
        "INACCESSIBLE. TRY LARGER TERMINAL.";

    m07Button.className =
        "section selected inaccessible";

    window.setTimeout(
        function () {
            m07Button.className =
                "section selected";
        },
        180
    );
}


function attemptM07Access() {

    if (isSmartTVBrowser()) {
        beginM07();
    }
    else {
        denyM07Access();
    }
}


/* ================================================================
   INPUT
================================================================ */

m07Button.onclick =
    function () {

        attemptM07Access();
    };


exitButton.onclick =
    function () {

        attemptExit();
    };


document.onkeydown =
    function (event) {

        event =
            event ||
            window.event;


        var keyCode =
            event.keyCode ||
            event.which;


        if (keyCode === 13) {

            if (!loadingStarted) {

                attemptM07Access();

                return;
            }


            if (
                exitButton.className.indexOf(
                    "visible"
                ) !== -1
            ) {

                attemptExit();

                return;
            }
        }


        /*
         * Desktop development shortcut.
         */

        if (
            keyCode === 32 &&
            !loadingStarted
        ) {

            attemptM07Access();
        }
    };
