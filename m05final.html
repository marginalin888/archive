```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Meridian — 05</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: #ddd;
            font-family: "Courier New", monospace;
            overflow: hidden;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            padding: 40px;
            text-align: center;
        }

        .message {
            margin-top: 180px;
            font-size: 28px;
            letter-spacing: 4px;
            position: relative;
        }

        .date {
            margin-top: 55px;
            font-size: 24px;
            position: relative;
        }

        /*
         * The glitch happens occasionally.
         * Most of the time the page looks completely normal.
         */

        .message {
            animation: messageGlitch 8s infinite;
        }

        .date {
            animation: dateGlitch 11s infinite;
        }

        @keyframes messageGlitch {

            0%,
            88%,
            90%,
            100% {
                transform: translate(0, 0);
                opacity: 1;
                text-shadow: none;
            }

            88.5% {
                transform: translate(-2px, 0);
                opacity: 0.75;
                text-shadow: 2px 0 #777;
            }

            89% {
                transform: translate(2px, 1px);
                opacity: 0.9;
                text-shadow: -2px 0 #555;
            }

            89.5% {
                transform: translate(-1px, -1px);
                opacity: 0.55;
            }
        }

        @keyframes dateGlitch {

            0%,
            91%,
            93%,
            100% {
                transform: translate(0, 0);
                opacity: 1;
            }

            91.5% {
                transform: translate(3px, 0);
                opacity: 0.7;
            }

            92% {
                transform: translate(-2px, 1px);
                opacity: 0.45;
                text-shadow: 2px 0 #777;
            }

            92.5% {
                transform: translate(1px, 0);
                opacity: 0.8;
            }
        }

        /*
         * Very subtle screen flicker.
         */

        body {
            animation: screenFlicker 13s infinite;
        }

        @keyframes screenFlicker {

            0%,
            94%,
            96%,
            100% {
                opacity: 1;
            }

            94.5% {
                opacity: 0.96;
            }

            95% {
                opacity: 0.92;
            }

            95.5% {
                opacity: 0.98;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="message">
            YOU WERE ASKING THE WRONG QUESTION
        </div>

        <div class="date">
            ⬟ 06/04/2026
        </div>

    </div>

</body>

</html>
```
