<!DOCTYPE html>
<html class="staticrypt-html">

<head>
    <meta charset="utf-8" />

    <title>Protected Page</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />

    <style>

        * {
            box-sizing: border-box;
        }

        .staticrypt-html {
            height: 100%;
        }

        .staticrypt-body {
            height: 100%;
            margin: 0;
        }

        .staticrypt-content {
            height: 100%;
            margin: 0;
            background: #111;
            color: #ddd;
            font-family: "Courier New", monospace;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .staticrypt-page {
            width: 90%;
            max-width: 500px;
            height: 100%;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .staticrypt-form {
            width: 100%;
            margin: 0;
            padding: 40px;

            background: #111;
            border: 1px solid #444;

            text-align: center;
            box-shadow: none;
        }

        .meridian-title {
            margin: 0;
            font-size: 42px;
            font-weight: normal;
            letter-spacing: 8px;
        }

        .meridian-subtitle {
            margin-top: 8px;
            margin-bottom: 35px;

            color: #777;

            font-size: 14px;
            letter-spacing: 3px;
        }

        .staticrypt-instructions {
            margin: 0;
        }

        .staticrypt-title {
            margin: 0 0 10px;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .staticrypt-instructions p:not(.staticrypt-title) {
            margin: 0;
            color: #777;
            font-size: 12px;
        }

        .staticrypt-hr {
            margin: 25px 0;
            border: 0;
            border-top: 1px solid #333;
        }

        .staticrypt-password-container {
            position: relative;
            width: 100%;
            margin: 0 0 15px;

            background: #181818;
            border: 1px solid #444;
        }

        .staticrypt-form input[type="password"],
        .staticrypt-form input[type="text"] {
            width: 100%;
            padding: 13px 40px 13px 13px;

            background: transparent;
            border: 0;
            outline: 0;

            color: #ddd;

            font-family: "Courier New", monospace;
            font-size: 15px;
            text-align: center;
        }

        .staticrypt-form input::placeholder {
            color: #555;
        }

        .staticrypt-password-container:focus-within {
            border-color: #777;
        }

        .staticrypt-toggle-password-visibility {
            cursor: pointer;

            height: 18px;
            width: 18px;

            opacity: 0.4;

            padding: 0;

            position: absolute;
            right: 12px;
            top: 50%;

            transform: translateY(-50%);
        }

        .staticrypt-form .staticrypt-decrypt-button {
            width: 100%;

            padding: 13px;

            background: #181818;
            border: 1px solid #555;

            color: #ddd;

            font-family: "Courier New", monospace;
            font-size: 13px;
            letter-spacing: 2px;

            cursor: pointer;
        }

        .staticrypt-form .staticrypt-decrypt-button:hover,
        .staticrypt-form .staticrypt-decrypt-button:active,
        .staticrypt-form .staticrypt-decrypt-button:focus {
            background: #222;
            border-color: #888;
            filter: none;
        }

        label.staticrypt-remember {
            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 15px;

            color: #777;
            font-size: 12px;
        }

        .staticrypt-remember input[type="checkbox"] {
            margin-right: 8px;
        }

        .meridian-footer {
            margin-top: 25px;

            color: #444;

            font-size: 10px;
            letter-spacing: 2px;
        }

        .hidden {
            display: none !important;
        }

        .staticrypt-spinner-container {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
        }

        .staticrypt-spinner {
            display: inline-block;

            width: 2rem;
            height: 2rem;

            border: 0.25em solid #444;
            border-right-color: transparent;

            border-radius: 50%;

            animation: spinner-border 0.75s linear infinite;
        }

        @keyframes spinner-border {
            100% {
                transform: rotate(360deg);
            }
        }

        @media screen and (max-width: 600px) {

            .staticrypt-form {
                padding: 30px;
            }

            .meridian-title {
                font-size: 32px;
                letter-spacing: 6px;
            }

        }

    </style>
</head>
